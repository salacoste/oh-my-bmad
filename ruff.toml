target-version = "py312"
line-length = 100

extend-exclude = [
    "upstream",
    ".venv",
    ".tmp",
    "_bmad",
    "_bmad-output",
    "node_modules",
    # Fixture payloads for CI-gate check scripts — deliberately contain
    # intentional violations that would otherwise produce ruff noise.
    "scripts/checks/fixtures",
    # AI-tool skill directories present at the repo root (not project code).
    # Add new ones as operators install new harnesses.
    ".agent",
    ".agent-os",
    ".agents",
    ".claude",
    ".cursor",
    ".gemini",
    ".opencode",
    ".pi",
    ".omc",
]

[lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "N",
]
[lint.per-file-ignores]
# E501: scaffold module docstrings are deliberately long reference prose.
# D: pydocstyle ruleset isn't currently selected, but tests don't need docstrings
# so we pre-stage the ignore for Story 1.6/1.7 when `D` may join the select list.
"tests/**" = ["B", "N", "D", "E501"]
"scripts/**" = ["N", "E501"]
"scripts/migrator/tests/**" = ["B", "N", "D", "E501"]
"services/*/src/*/__main__.py" = ["E501"]
"packages/*/src/*/__init__.py" = ["E501"]
"services/*/src/*/__init__.py" = ["E501"]
"mcp-servers/*/src/*/__init__.py" = ["E501"]
# Alembic migration files use date-prefixed names (e.g. 2026-04-24_0001_initial_schema.py)
# which violate N999 (invalid module name). This is the standard Alembic convention.
"services/*/src/*/migrations/versions/*.py" = ["N999"]

[format]
# Ruff's default formatter settings are fine — single source of truth.
