[project]
name = "secret-hygiene"
version = "0.2.0"
description = "Secret scanner (pre-commit) + structlog log-sanitizer + license-scan wrapper + AuditedSecret wrapper. Three-layer secret-hygiene enforcement per NFR-S1 plus audit emission per FR42 / NFR-S3."
authors = [
    { name = "R2d2", email = "bad.vano23ru@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "structlog>=24.1",
    "events",
    "pydantic-settings>=2.5,<3.0",
]

[project.optional-dependencies]
license-scan = ["scancode-toolkit>=32.0.0"]

[project.scripts]
secret-hygiene-precommit = "secret_hygiene.precommit_hook:main"
secret-hygiene-commit-msg = "secret_hygiene.precommit_hook:commit_msg_main"
secret-hygiene-license-scan = "secret_hygiene.license_scan:license_scan_main"

[build-system]
requires = ["uv_build>=0.11.0,<1.0"]
build-backend = "uv_build"
