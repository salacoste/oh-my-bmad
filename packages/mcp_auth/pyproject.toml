[project]
name = "mcp-auth"
version = "0.1.0"
description = "Bearer token auth middleware for MCP Streamable HTTP transport (Phase 10). Validates JWT tokens on incoming ASGI requests and extracts actor identity."
authors = [
    { name = "R2d2", email = "bad.vano23ru@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "pyjwt>=2.8",
    "pydantic>=2.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<1.0"]
build-backend = "uv_build"
