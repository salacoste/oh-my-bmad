<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" preserveAspectRatio="xMidYMid meet" role="img" aria-label="oh-my-bmad — a self-hosted autonomous-development platform">
  <title>oh-my-bmad</title>
  <desc>A self-hosted, autonomous-development platform for one operator.</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>

    <radialGradient id="glow" cx="22%" cy="32%" r="58%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#1f6feb" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="82%" cy="72%" r="48%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#bc8cff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="33%" stop-color="#bc8cff"/>
      <stop offset="66%" stop-color="#ff7b72"/>
      <stop offset="100%" stop-color="#f0883e"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background layers -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.45"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect width="1280" height="320" fill="url(#glow2)"/>

  <!-- Top + bottom accent stripes -->
  <rect x="0" y="0" width="1280" height="2" fill="url(#rainbow)" opacity="0.75"/>
  <rect x="0" y="318" width="1280" height="2" fill="url(#rainbow)" opacity="0.4"/>

  <!-- Title: "oh-my-bmad" in monospace with a colored cursor accent -->
  <text x="640" y="142" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        font-size="84" font-weight="700" fill="#f0f6fc" letter-spacing="-2">
    <tspan>oh-my-bmad</tspan><tspan fill="#58a6ff" dx="4">_</tspan>
  </text>

  <!-- Tagline -->
  <text x="640" y="190" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="22" font-weight="400" fill="#8b949e">
    A self-hosted, autonomous-development platform for one operator.
  </text>

  <!-- Tech chip line -->
  <text x="640" y="232" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="13" font-weight="500" fill="#6e7681" letter-spacing="2.4">
    PYTHON 3.12  ·  FASTAPI  ·  AIOGRAM v3  ·  MCP STDIO  ·  EVENT-SOURCED  ·  MYPY --STRICT
  </text>

  <!-- Phase 1 badge -->
  <g transform="translate(540, 262)">
    <rect width="200" height="34" rx="17"
          fill="#1f6feb" fill-opacity="0.12"
          stroke="#1f6feb" stroke-opacity="0.5"/>
    <circle cx="22" cy="17" r="4" fill="#3fb950"/>
    <text x="115" y="22" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
          font-size="13" font-weight="600" fill="#79c0ff">
      Phase 1 · shipped 2026-05
    </text>
  </g>
</svg>
