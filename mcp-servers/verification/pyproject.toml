[project]
name = "verification-mcp"
version = "0.1.0"
description = "MCP server running the project's build + test/verification recipes sandboxed to the active worktree (Epic 17 / FR74). Story 17.2 ships the scaffold + clawhip-bridge audit wiring; verification tools land in 17.3/17.4."
authors = [
    { name = "R2d2", email = "bad.vano23ru@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "events>=0.3.0",
    "capabilities",
]

[build-system]
requires = ["uv_build>=0.11.0,<1.0"]
build-backend = "uv_build"
