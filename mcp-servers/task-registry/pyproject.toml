[project]
name = "task-registry-mcp"
version = "0.1.0"
description = "MCP server exposing task list / detail / approval-queue / blockers (read) + bounded-write tools (task.add_note, task.attach_artifact, task.emit_event)."
authors = [
    { name = "R2d2", email = "bad.vano23ru@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "events>=0.3.0",
    "registry-state>=0.5.0",
    "pydantic>=2.8",
]

[build-system]
requires = ["uv_build>=0.11.0,<1.0"]
build-backend = "uv_build"
