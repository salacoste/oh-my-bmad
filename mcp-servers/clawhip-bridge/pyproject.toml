[project]
name = "clawhip-bridge-mcp"
version = "0.2.0"
description = "MCP server: append-only event-emission surface (emit_event, emit_blocker, emit_summary, emit_approval_request, emit_completion). Sole mutation path to registry per FR26."
authors = [
    { name = "R2d2", email = "bad.vano23ru@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "events>=0.3.0",
    "registry-state>=0.5.0",
    "pydantic>=2.8",
]

[build-system]
requires = ["uv_build>=0.11.0,<1.0"]
build-backend = "uv_build"
