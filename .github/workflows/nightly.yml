name: nightly

# Story 2.11 — crash-injection harness (NFR-R1 / NFR-R2 continuous verification).
# Full slow-matrix (separability + crash-injection + idempotency replay) lands
# across Stories 2.11–2.15. This initial nightly runs the crash-injection job;
# other slow jobs are added per their respective stories.
#
# Schedule: 3am UTC daily. A push to main also triggers the workflow so a
# freshly merged crash-harness change can be validated without waiting 24h.

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths:
      - "Dockerfile.base"
      - "justfile"
      - "tests/crash-injection/**"
      - "tests/idempotency/**"
      - "tests/migrator/**"
      - "tests/separability/**"
      - "tests/fixtures/null-orchestrator/**"
      - "scripts/migrator/**"
      - "services/registry-state/**"
      - "services/registry-api/**"
      - "packages/events/**"
      - "packages/idempotency/**"
      - "packages/capabilities/**"
      - "cosmic-ray.toml"
      - "scripts/mutation_score.py"
      - "docker-compose.yml"
      - ".github/workflows/nightly.yml"
  workflow_dispatch:

permissions:
  contents: read

# Concurrency: serialize nightly runs but do NOT cancel in-flight runs —
# letting a slow run finish is better than producing a half-result.
# Group name covers BOTH jobs (crash-injection + idempotency-replay) — review
# M4 renamed `nightly-crash` → `nightly` for accuracy.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  crash-injection:
    name: Crash-injection harness (NFR-R1 / NFR-R2)
    runs-on: ubuntu-latest
    # Bumped from 15 to 25 minutes: the base image build on a cold runner
    # plus 4 phase tests with 60s healthcheck budgets per restart leaves
    # little headroom at 15. 25 minutes preserves nightly's "fail fast on
    # genuine hangs" intent.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install just
        # ``just test-crash`` and ``just build-base`` require the just CLI;
        # ubuntu-latest does not ship with it.
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync workspace (incl. dev deps)
        run: uv sync --frozen --dev

      - name: Build base image
        # services/registry-state/Dockerfile FROMs oh-my-bmad-base:local
        run: just build-base

      - name: Build registry-state image
        run: docker compose -f docker-compose.yml build registry-state

      - name: Run crash-injection harness
        run: just test-crash

      # Story 11.3.3 AC2: capture container logs + state on failure so the
      # AC2 REGISTRY_STATE_LIFESPAN_TRACE phase markers (enabled in
      # tests/crash-injection/docker-compose.test.yml) reveal which lifespan
      # phase hangs on Linux runners. Mirrors the s3-separability job's
      # equivalent step. Captures all running + stopped containers.
      - name: Capture compose logs on failure
        if: failure()
        run: |
          mkdir -p _bmad-output/test-artifacts
          docker ps -a > _bmad-output/test-artifacts/crash-injection-docker-ps.txt 2>&1 || true
          # Truncate fresh (`:>`) so a cached/retried runner workspace can't
          # concatenate stale logs from a prior run into this artifact.
          logfile=_bmad-output/test-artifacts/crash-injection-container-logs.txt
          : > "$logfile"
          cids=$(docker ps -aq --filter "name=registry-state")
          if [ -z "$cids" ]; then
            # Emit an explicit sentinel so an empty match is distinguishable
            # from "everything was fine" when reading the artifact.
            echo "=== no containers matched --filter name=registry-state ===" >> "$logfile"
          fi
          for cid in $cids; do
            echo "=== container $cid ===" >> "$logfile"
            docker logs "$cid" >> "$logfile" 2>&1 || true
            echo "=== inspect $cid ===" >> "$logfile"
            docker inspect "$cid" >> "$logfile" 2>&1 || true
          done

      - name: Upload crash-injection summary artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: crash-injection-summary-${{ github.run_id }}
          path: |
            _bmad-output/test-artifacts/crash-injection-summary-*.json
            _bmad-output/test-artifacts/crash-injection-docker-ps.txt
            _bmad-output/test-artifacts/crash-injection-container-logs.txt
          # `warn` (not `error`): the summary JSON may be absent when
          # tests timed out before emitting it (Story 11.3.3 scenario);
          # we still want the docker-logs / inspect output uploaded.
          if-no-files-found: warn
          retention-days: 30

  idempotency-replay:
    name: Idempotency 100× replay (NFR-R4 / FR28)
    # Story 2.13 — verifies the registry-api dedup invariant: 100 concurrent
    # POSTs with the same Idempotency-Key produce exactly 1 task row and 100
    # byte-identical 201 responses; runs 10 parametrized iterations to catch
    # flakiness. No Docker required (in-memory SQLite + ASGI transport).
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync workspace (incl. dev deps)
        run: uv sync --frozen --dev

      - name: Run idempotency 100× replay test
        # Mn9: emit junitxml so the upload step has a flakiness signal beyond
        # pass/fail. Story 11.3.3 Fix-A: the `*ARGS` splat in
        # `test-idempotency *ARGS` already forwards trailing arguments
        # without needing an explicit `--` separator. A leading `--`
        # propagates through to pytest, which treats it as the
        # option/positional-file separator, causing `--junitxml=...`
        # to be parsed as a (nonexistent) file path. Drop the `--`.
        run: |
          mkdir -p _bmad-output/test-artifacts
          just test-idempotency --junitxml=_bmad-output/test-artifacts/idempotency-replay-${{ github.run_id }}.xml

      - name: Upload idempotency artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: idempotency-replay-${{ github.run_id }}
          path: _bmad-output/test-artifacts/idempotency-replay-*.xml
          # `warn` (not `error`): not all runs produce flakiness data, but
          # CI failures must surface a junitxml under the artifact name.
          if-no-files-found: warn
          retention-days: 30

  litestream-restore-drill:
    name: litestream restore drill (FR71 / Story 13.3)
    # Story 13.3 — hermetic disaster-recovery proof: seed a WAL SQLite db,
    # replicate to a local FILE replica (no cloud creds), simulate host loss,
    # `litestream restore`, assert PRAGMA integrity_check + exact row count.
    # Exercises the same litestream restore code path as
    # `just restore-from-litestream` minus the S3 transport (the transport is the
    # operator's own bucket, validated live per ADR-0007). Docker + python3 are
    # preinstalled on ubuntu-latest; no workspace sync needed.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Run litestream restore drill
        run: just litestream-restore-drill

  migrator-integration:
    name: Migrator integration (FR22 / NFR-M3)
    # Story 2.14 — verifies the v1.0.0 → v1.0.1 schema migrator over a
    # 100-event fixture: shape, envelope round-trip, materialized-state
    # equivalence between archive and migrated log, and idempotent rerun.
    # Runs the in-process suite (no Docker required — pure pytest invoking
    # ``migrator.cli.main`` against a tmp_path-staged fixture). The Docker
    # smoke test for the compose plumbing is provided separately by the
    # ``just migrator-test-additive`` recipe (Story 1.3); a duplicate
    # Docker-based test in this nightly was deferred per Task 5.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync workspace (incl. dev deps)
        run: uv sync --frozen --dev

      - name: Run migrator integration tests
        # Emit junitxml so flakiness signal survives beyond pass/fail.
        # The just recipe accepts trailing pytest args via *ARGS.
        run: |
          mkdir -p _bmad-output/test-artifacts
          just test-migrator --junitxml=_bmad-output/test-artifacts/migrator-integration-${{ github.run_id }}.xml

      - name: Upload migrator integration artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: migrator-integration-${{ github.run_id }}
          path: _bmad-output/test-artifacts/migrator-integration-*.xml
          if-no-files-found: warn
          retention-days: 30

  s3-separability:
    name: S-3 separability orchestrator-swap (FR35 / NFR-M5)
    # Story 2.15 — boots a 3-service compose stack with
    # ``ORCHESTRATOR_IMAGE=null-orchestrator:latest``, POSTs a task, and
    # asserts the canonical 5-event lifecycle reaches ``task.completed``
    # without modifying spine source code. Builds the null-orchestrator
    # fixture image as part of the test (idempotent helper).
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync workspace (incl. dev deps)
        run: uv sync --frozen --dev

      - name: Build base image
        # services/registry-state/Dockerfile + services/registry-api/Dockerfile
        # both FROM oh-my-bmad-base:local. Build before compose builds run.
        run: just build-base

      - name: Build registry-state + registry-api images
        # Pre-build the spine images so compose ``up -d`` doesn't pay the
        # build cost inline against the test's healthcheck budget.
        run: |
          docker compose -f docker-compose.yml build registry-state registry-api

      - name: Run S-3 separability tests
        # Emit junitxml so flakiness signal survives beyond pass/fail.
        # The just recipe accepts trailing pytest args via *ARGS.
        run: |
          mkdir -p _bmad-output/test-artifacts
          just test-separability --junitxml=_bmad-output/test-artifacts/s3-separability-${{ github.run_id }}.xml

      - name: Capture compose logs on failure
        if: failure()
        run: |
          mkdir -p _bmad-output/test-artifacts
          docker ps -a > _bmad-output/test-artifacts/s3-docker-ps.txt 2>&1 || true

      - name: Upload S-3 separability artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: s3-separability-${{ github.run_id }}
          path: _bmad-output/test-artifacts/s3-separability-*.xml
          if-no-files-found: warn
          retention-days: 30

  mutation-gate:
    name: Mutation-testing gate (NFR-O11, gating)
    # Story 14.3 — GATING mutation-score gate over the 3 kernel modules
    # (capabilities/tiers.py, events/schema_registry.py, events/canonical.py)
    # via cosmic-ray. cosmic-ray mutates the real source IN PLACE under VCS and
    # restores it after each mutant, so this workspace's editable installs
    # actually exercise the mutation (mutmut produced a false 0% because it
    # copies sources to mutants/ that editable imports never resolve to).
    #
    # GATING in 14.3: `just mutation-gate` (NO `|| true`) — the gate FAILS the
    # nightly when the score drops below the version-controlled threshold (82 =
    # floor of the 82.4% / 145-176 first-nightly baseline; ratchet UP as mutants
    # are killed, see docs/testing-guide.md — never lower it silently). The score
    # is still published to the step summary + a 30-day artifact even on failure
    # (the publish + upload steps run `if: always()`), so a gate failure stays
    # diagnosable. No Docker required (pure pytest + in-memory fixtures).
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync workspace (incl. dev deps)
        run: uv sync --frozen --dev

      - name: Run mutation gate (NFR-O11, gating)
        # NO `|| true`: Story 14.3 flips this job to GATING. `just mutation-gate`
        # invokes mutation_score.py with `--threshold 82`, which exits non-zero
        # when the score < 82 — failing this step (and the job). The score line
        # is still tee'd to a per-run file so the publish + upload steps below
        # (both `if: always()`) surface the score on the run summary + artifact
        # even when the gate fails. `set -o pipefail` makes the `tee` pipeline
        # inherit `just`'s non-zero exit (otherwise `tee`'s 0 would mask it).
        run: |
          set -o pipefail
          mkdir -p _bmad-output/test-artifacts
          score_file="_bmad-output/test-artifacts/mutation-score-${{ github.run_id }}.txt"
          just mutation-gate 2>&1 | tee "$score_file"

      - name: Publish mutation score to step summary
        # `if: always()` — surface the score on the run summary even when the
        # gate step above failed (score < threshold), so the failure is
        # diagnosable without downloading the artifact.
        if: always()
        run: |
          score_file="_bmad-output/test-artifacts/mutation-score-${{ github.run_id }}.txt"
          echo "## Mutation-testing gate (NFR-O11, gating · threshold 82)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$score_file" ]; then
            grep -E "^(mutation-score:|OK:|FAIL:)" "$score_file" >> "$GITHUB_STEP_SUMMARY" \
              || echo "no mutation-score line produced (see artifact)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no score file produced (see artifact)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation-score artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mutation-score-${{ github.run_id }}
          path: _bmad-output/test-artifacts/mutation-score-*.txt
          if-no-files-found: warn
          retention-days: 30
