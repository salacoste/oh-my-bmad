name: release

# Tag-triggered multi-arch build + push of all platform-owned service images
# to GHCR. See Story 1.9 spec for design rationale.
#
# Hand-off from Story 1.8: per-service Dockerfiles `FROM oh-my-bmad-base:local`
# which doesn't exist on a fresh runner. We build + push the base FIRST, then
# override the base reference via buildx `--build-context base=...` during
# per-service builds.
#
# Third-party actions are pinned by commit SHA with version tag in comment.
# Update SHA + comment together when bumping versions. Only non-prerelease
# tags (no `-` in version) advance the `:latest` tag; prerelease tags
# (e.g. v0.2.0-rc1) publish the versioned tag only.

on:
  push:
    tags: ['v*']

# Workflow permissions — DO NOT remove `id-token: write` or `attestations: write` as
# "unused": they are deliberately pre-staged for Phase 2 Epic 8 supply-chain stories
# (8.2 SLSA L2 attestation [shipped], 8.3 cosign keyless sign, 8.4 cosign attest SBOM).
# Both scope to this workflow only — no blast radius on ci.yml or nightly.yml.
permissions:
  contents: read
  packages: write
  id-token: write       # OIDC token issuance — required by actions/attest-build-provenance keyless cert minting (also unlocks cosign keyless in Story 8.3).
  attestations: write   # push-to-registry: true — required by attest-build-provenance to write attestations back to the OCI registry (also unlocks cosign attest in Story 8.4).

concurrency:
  # Release-wide singleton: only one release runs at a time globally,
  # preventing concurrent tag pushes from racing each other on :latest.
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push-base:
    name: Build + push base image
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # bumped 20 → 25 (Story 1.8 cold-cache arm64 QEMU) → 30 (Phase 2 Story 8.2 SLSA + 8.1 SBOM; budget breakdown: ~20 min cold build + ~60s SLSA + ~90s SBOM + headroom for Stories 8.3 cosign-sign / 8.4 cosign-attest)
    outputs:
      version: ${{ steps.ver.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
      latest_tags: ${{ steps.ver.outputs.latest_tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Extract + validate version from tag
        id: ver
        run: |
          set -euo pipefail
          raw="${GITHUB_REF_NAME#v}"
          # Docker-tag-safe semver: MAJOR.MINOR.PATCH with optional -prerelease
          # (alphanumerics + dots + hyphens). Rejects non-semver tags like
          # `vnext`, `vendored`, `v1.0` (no patch), `v1.0+build.5` (has `+`,
          # which is not a valid Docker tag character).
          if ! echo "${raw}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match v<MAJOR>.<MINOR>.<PATCH>[-<prerelease>]" >&2
            exit 1
          fi
          echo "version=${raw}" >> "$GITHUB_OUTPUT"
          # :latest only advances on non-prerelease tags. Prerelease tags
          # contain a hyphen per semver 2.0.
          if echo "${raw}" | grep -q '-'; then
            echo "latest_tags=" >> "$GITHUB_OUTPUT"
            echo "Prerelease tag detected; :latest will NOT be updated."
          else
            echo "latest_tags=${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-base:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build + push base (multi-arch)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: Dockerfile.base
          target: runtime-base
          platforms: linux/amd64,linux/arm64
          push: true
          # Disable attestations + SBOM — avoids adding extra manifest entries
          # that some downstream pullers (older docker, strict-media-type
          # k8s image pullers) choke on. Signing + SBOM is Phase 2 hardening.
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-base:${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: Tag base as :latest (stable releases only)
        if: steps.ver.outputs.latest_tags != ''
        env:
          SRC: ${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-base:${{ steps.ver.outputs.version }}
          DST: ${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-base:latest
        run: |
          docker buildx imagetools create -t "${DST}" "${SRC}"

      # ---------------------------------------------------------------------
      # Story 8.2 (Phase 2 Epic 8): SLSA Build Level 2 provenance attestation.
      # GitHub-first-party `actions/attest-build-provenance` mints a Sigstore
      # keyless cert via the workflow's OIDC identity, signs a SLSA L2
      # provenance predicate against the image's content digest, and pushes
      # the attestation to GHCR alongside the image (push-to-registry: true).
      #
      # Operator verifies deploy-side. Canonical command lives in
      # docs/deployment-guide.md (Story 8.5 owns the `just verify-images`
      # recipe that automates this). Anchored verify-command template:
      #   cosign verify-attestation --type slsaprovenance \
      #     --certificate-identity-regexp "^https://github.com/${OWNER}/oh-my-bmad/\.github/workflows/release\.yml@refs/tags/v[0-9].*" \
      #     --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
      #     <image>@<digest>
      # ^ anchored regexp prevents fork-attestation spoofing (BH-1).
      # ^ if this workflow file is renamed, update the regexp atomically in
      #   docs/deployment-guide.md + ADR-0008 + this comment (EC-4).
      #
      # POLICY: SLSA attestation runs for ALL released tags (stable AND
      # prerelease) deliberately — operators verify staging-image pulls
      # too, not just stable. Rekor transparency-log growth is expected
      # behavior; not a bug (EC-1, EC-5). Sigstore Fulcio/Rekor outage =
      # hard release block (no continue-on-error) — intentional, see
      # ADR-0008 (EC-6).
      #
      # See ADR-0008 for the supply-chain triumvirate rationale.
      # ---------------------------------------------------------------------
      - name: Generate SLSA L2 provenance attestation (base)
        id: attest-base
        if: steps.build.outputs.digest != ''  # F6: fail loudly if upstream digest is empty
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-base
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # ---------------------------------------------------------------------
      # Story 8.1 (Phase 2 Epic 8): CycloneDX SBOM generation for base image.
      # See ADR-0008 for the supply-chain triumvirate rationale.
      # This step produces the SBOM as a workflow artifact. Story 8.4
      # attaches it as a cosign attestation; Story 8.5 verifies it deploy-side.
      # ---------------------------------------------------------------------
      - name: Generate CycloneDX SBOM (base)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-base:${{ steps.ver.outputs.version }}
          format: cyclonedx-json
          output-file: sbom-base.cyclonedx.json
          artifact-name: sbom-base

      - name: Upload base SBOM as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom-base-${{ steps.ver.outputs.version }}
          path: sbom-base.cyclonedx.json
          retention-days: 90

  build-and-push-services:
    name: Build + push ${{ matrix.service }}
    needs: build-and-push-base
    runs-on: ubuntu-24.04
    timeout-minutes: 40  # bumped 30 → 40 (Phase 2 Story 8.2 SLSA + 8.1 SBOM + Stories 8.3 cosign-sign / 8.4 cosign-attest in flight); matrix variance + 4 supply-chain steps justify ~10 min headroom
    strategy:
      fail-fast: false
      matrix:
        service:
          - registry-api
          - registry-state
          - telegram-gateway
          - orchestrator-adapter
          - worker-wrapper
          - clawhip-daemon
          - console-cli
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build + push ${{ matrix.service }} (multi-arch)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-${{ matrix.service }}:${{ needs.build-and-push-base.outputs.version }}
          # Pin base-image override to the base's content digest (not the
          # mutable tag) so a re-run or concurrent push can't race the base
          # reference. Emitted by the base build-push-action's step output.
          build-contexts: |
            oh-my-bmad-base:local=docker-image://${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-base@${{ needs.build-and-push-base.outputs.digest }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Tag ${{ matrix.service }} as :latest (stable releases only)
        if: needs.build-and-push-base.outputs.latest_tags != ''
        env:
          SRC: ${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-${{ matrix.service }}:${{ needs.build-and-push-base.outputs.version }}
          DST: ${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-${{ matrix.service }}:latest
        run: |
          docker buildx imagetools create -t "${DST}" "${SRC}"

      # ---------------------------------------------------------------------
      # Story 8.2 (Phase 2 Epic 8): SLSA L2 provenance per service image.
      # Same pattern + same policy as the base-job SLSA step (see comment
      # block above the base step for the canonical verify-attestation
      # command + policy notes on prerelease + outage behavior).
      # Matrix-scoped `steps.build.outputs.digest` is per-service; fail-fast:
      # false on the matrix means one service's SLSA failure isolates to its
      # own matrix entry without aborting siblings.
      # ---------------------------------------------------------------------
      - name: Generate SLSA L2 provenance attestation (${{ matrix.service }})
        id: attest-service
        if: steps.build.outputs.digest != ''  # F6: fail loudly if upstream digest is empty
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # ---------------------------------------------------------------------
      # Story 8.1 (Phase 2 Epic 8): CycloneDX SBOM per service image.
      # See ADR-0008. Stories 8.2-8.4 chain SLSA + cosign sign + attest;
      # Story 8.5 verifies deploy-side. CI fails if SBOM generation fails
      # (fail-fast matrix; one service's SBOM-failure does not block the
      # rest of the matrix per `fail-fast: false`).
      # ---------------------------------------------------------------------
      - name: Generate CycloneDX SBOM (${{ matrix.service }})
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-${{ matrix.service }}:${{ needs.build-and-push-base.outputs.version }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.service }}.cyclonedx.json
          artifact-name: sbom-${{ matrix.service }}

      - name: Upload ${{ matrix.service }} SBOM as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom-${{ matrix.service }}-${{ needs.build-and-push-base.outputs.version }}
          path: sbom-${{ matrix.service }}.cyclonedx.json
          retention-days: 90
