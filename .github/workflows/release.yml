name: release

# Tag-triggered multi-arch build + push of all platform-owned service images
# to GHCR. See Story 1.9 spec for design rationale.
#
# Hand-off from Story 1.8: per-service Dockerfiles `FROM oh-my-bmad-base:local`
# which doesn't exist on a fresh runner. We build + push the base FIRST, then
# override the base reference via buildx `--build-context base=...` during
# per-service builds.
#
# Third-party actions are pinned by commit SHA with version tag in comment.
# Update SHA + comment together when bumping versions. Only non-prerelease
# tags (no `-` in version) advance the `:latest` tag; prerelease tags
# (e.g. v0.2.0-rc1) publish the versioned tag only.

on:
  push:
    tags: ['v*']

# Workflow permissions — DO NOT remove `id-token: write` or `attestations: write` as
# "unused": Phase 2 Epic 8 supply-chain stories shipped:
#   - 8.2 SLSA L2 attestation [shipped df52455]
#   - 8.3 cosign keyless sign  [shipped 9efcd43]
#   - 8.4 cosign attest SBOM   [shipped c605dc5]
# Both scope to this workflow only — no blast radius on ci.yml or nightly.yml.
#
# Code-review pass-2 F7 WARNING: these permissions are set at WORKFLOW level
# (not per-job) and therefore inherit to EVERY job in this workflow. New
# jobs added below that do NOT need OIDC token minting or attestation-write
# MUST override with `permissions: {}` at job level to maintain least
# privilege. Audit checklist when adding a new job:
#   1. Does the job invoke `actions/attest-build-provenance` or `cosign`? → keep inherited permissions
#   2. Does the job push to GHCR? → only `packages: write` needed; override with explicit job-level block
#   3. Does the job just notify/lint/changelog? → `permissions: {}` (no inheritance)
permissions:
  contents: read
  packages: write
  id-token: write       # OIDC token issuance — required by actions/attest-build-provenance keyless cert minting + cosign keyless sign (Story 8.3).
  attestations: write   # push-to-registry: true — required by attest-build-provenance to write attestations back to the OCI registry + cosign attest (Story 8.4).

concurrency:
  # Release-wide singleton: only one release runs at a time globally,
  # preventing concurrent tag pushes from racing each other on :latest.
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push-base:
    name: Build + push base image
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # budget breakdown: ~20 min cold build + ~60s SLSA + ~90s SBOM + ~90s cosign (install + sign + attest) = ~23 min; ~7 min headroom against 30-min cap (F13 explicit budget per code review). History: bumped 20 → 25 (Story 1.8 cold-cache arm64 QEMU) → 30 (Phase 2 supply-chain).
    outputs:
      version: ${{ steps.ver.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
      latest_tags: ${{ steps.ver.outputs.latest_tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Extract + validate version from tag
        id: ver
        run: |
          set -euo pipefail
          raw="${GITHUB_REF_NAME#v}"
          # Docker-tag-safe semver: MAJOR.MINOR.PATCH with optional -prerelease
          # (alphanumerics + dots + hyphens). Rejects non-semver tags like
          # `vnext`, `vendored`, `v1.0` (no patch), `v1.0+build.5` (has `+`,
          # which is not a valid Docker tag character).
          if ! echo "${raw}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match v<MAJOR>.<MINOR>.<PATCH>[-<prerelease>]" >&2
            exit 1
          fi
          echo "version=${raw}" >> "$GITHUB_OUTPUT"
          # :latest only advances on non-prerelease tags. Prerelease tags
          # contain a hyphen per semver 2.0.
          if echo "${raw}" | grep -q '-'; then
            echo "latest_tags=" >> "$GITHUB_OUTPUT"
            echo "Prerelease tag detected; :latest will NOT be updated."
          else
            echo "latest_tags=${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-base:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4.0.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Build + push base (multi-arch)
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          file: Dockerfile.base
          target: runtime-base
          platforms: linux/amd64,linux/arm64
          push: true
          # Disable BuildKit's native attestation + SBOM — avoids extra manifest
          # entries that some downstream pullers (older docker, strict-media-type
          # k8s image pullers) choke on. SLSA L2 provenance is generated separately
          # by `actions/attest-build-provenance` below (Story 8.2 shipped); SBOM is
          # generated by `anchore/sbom-action` (Story 8.1 shipped); cosign signing
          # by `sigstore/cosign-installer` + `cosign sign|attest` (Stories 8.3/8.4
          # shipped). These three external generators produce signed attestations
          # on the Sigstore transparency log, NOT BuildKit's in-manifest variant.
          # See ADR-0008 for the full supply-chain triumvirate rationale.
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-base:${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: Tag base as :latest (stable releases only)
        if: steps.ver.outputs.latest_tags != ''
        env:
          SRC: ${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-base:${{ steps.ver.outputs.version }}
          DST: ${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-base:latest
        run: |
          docker buildx imagetools create -t "${DST}" "${SRC}"

      # ---------------------------------------------------------------------
      # Story 8.2 (Phase 2 Epic 8): SLSA Build Level 2 provenance attestation.
      # GitHub-first-party `actions/attest-build-provenance` mints a Sigstore
      # keyless cert via the workflow's OIDC identity, signs a SLSA L2
      # provenance predicate against the image's content digest, and pushes
      # the attestation to GHCR alongside the image (push-to-registry: true).
      #
      # Operator verifies deploy-side. Canonical command lives in
      # docs/deployment-guide.md (Story 8.5 owns the `just verify-images`
      # recipe that automates this). Anchored verify-command template:
      #   cosign verify-attestation --type slsaprovenance \
      #     --certificate-identity-regexp "^https://github.com/${OWNER}/oh-my-bmad/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$" \
      #     --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
      #     <image>@<digest>
      # ^ anchored regexp prevents fork-attestation spoofing (BH-1).
      # ^ if this workflow file is renamed, update the regexp atomically in
      #   docs/deployment-guide.md + ADR-0008 + this comment (EC-4).
      #
      # POLICY: SLSA attestation runs for ALL released tags (stable AND
      # prerelease) deliberately — operators verify staging-image pulls
      # too, not just stable. Rekor transparency-log growth is expected
      # behavior; not a bug (EC-1, EC-5). Sigstore Fulcio/Rekor outage =
      # hard release block (no continue-on-error) — intentional, see
      # ADR-0008 (EC-6).
      #
      # See ADR-0008 for the supply-chain triumvirate rationale.
      #
      # Code-review pass-2 F2+F6: an `if:` condition that evaluates false in
      # GitHub Actions SKIPS the step (CI shows green); it does NOT fail the
      # job. The previous F6 fix relied on `if: digest != ''` as a "fail
      # loudly" guard, but that is semantically backwards — if the digest
      # were empty, the image would land in GHCR unattested and CI would
      # report success. The dedicated validate step below fails the job
      # outright on empty OR malformed digest. Subsequent attestation steps
      # retain the `if:` as defense-in-depth (skip a step whose input is
      # known-empty after the validate failed), but the primary contract is
      # "validate step fails => job fails => no unattested image is published".
      # ---------------------------------------------------------------------
      - name: Validate build digest before attestation (base)
        id: validate-digest-base
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -z "${DIGEST}" ]; then
            echo "::error::docker/build-push-action produced empty digest — refusing to publish unattested base image (F2)"
            exit 1
          fi
          if ! printf '%s' "${DIGEST}" | grep -qE '^sha256:[a-f0-9]{64}$'; then
            echo "::error::Malformed base digest: ${DIGEST} — expected sha256:<64 hex chars> (F6)"
            exit 1
          fi
          printf 'base digest validated: %s\n' "${DIGEST}"

      - name: Generate SLSA L2 provenance attestation (base)
        id: attest-base
        if: steps.build.outputs.digest != ''  # defense-in-depth — validate-digest-base above is the primary contract
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-base
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # ---------------------------------------------------------------------
      # Story 8.1 (Phase 2 Epic 8): CycloneDX SBOM generation for base image.
      # See ADR-0008 for the supply-chain triumvirate rationale.
      # This step produces the SBOM as a workflow artifact. Story 8.4
      # attaches it as a cosign attestation; Story 8.5 verifies it deploy-side.
      #
      # Code-review pass-2 F5: SBOM generation is digest-bound (the scanner
      # pulls the image by tag, but the tag was just pushed by the build
      # step and is content-addressed by the validated digest). The
      # validate-digest-base step above is the primary contract; the `if:`
      # here mirrors the other supply-chain steps for consistency.
      # ---------------------------------------------------------------------
      - name: Generate CycloneDX SBOM (base)
        if: steps.build.outputs.digest != ''  # F5: matches the SLSA + cosign step guards
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-base:${{ steps.ver.outputs.version }}
          format: cyclonedx-json
          output-file: sbom-base.cyclonedx.json
          artifact-name: sbom-base

      # ---------------------------------------------------------------------
      # NFR-S11 / G1: publish-time license-incompatibility gate. FR40's
      # commit-time copyleft/proprietary block (secret-hygiene pre-push scan)
      # is extended to publish-time here: the CycloneDX SBOM generated above is
      # scanned and the job FAILS if any component declares a license
      # incompatible with the repo's MIT license — so the image is never signed
      # (no continue-on-error) and never becomes a valid release. The gate
      # reuses secret_hygiene.license_scan verbatim (single source of truth, no
      # forked policy), invoked via uv (no forked policy in YAML).
      # ---------------------------------------------------------------------
      - name: Install uv + Python 3.12 (license gate)
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.12"

      - name: Sync workspace (license gate)
        run: uv sync --frozen

      - name: License-incompatibility gate (NFR-S11 / FR40 publish-time)
        run: uv run python scripts/check_sbom_licenses.py --sbom sbom-base.cyclonedx.json

      # ---------------------------------------------------------------------
      # Story 8.3 (Phase 2 Epic 8): cosign keyless signing — third + outermost
      # gate of the supply-chain triumvirate. The signature wraps an image
      # whose SLSA L2 attestation (Story 8.2) + CycloneDX SBOM (Story 8.1)
      # are already published.
      #
      # Keyless mode: signing cert is minted by Sigstore Fulcio per call from
      # the workflow's OIDC token (`id-token: write` permission, added by
      # Story 8.2 prep-staging). No long-lived signing key.
      #
      # Operator verifies deploy-side. Canonical command lives in
      # docs/deployment-guide.md (Story 8.5 SHIPPED — see `just verify-images`
      # recipe). Anchored verify-command template (pass-2 F1+F3 corrected):
      #   cosign verify \
      #     --certificate-identity-regexp "^https://github.com/${OWNER}/oh-my-bmad/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$" \
      #     --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
      #     <image>@<digest>
      #
      # Sigstore Fulcio/Rekor outage = hard release block (intentional per
      # ADR-0008 §"Operational policy notes"). `fail-fast: false` (matrix
      # only) preserves sibling isolation under transient signing failures.
      #
      # Story 8.3 pass-2 F10+F11: cosign-installer pinned by action SHA AND
      # cosign binary version pinned via `cosign-release:` to prevent
      # behavioral drift from upstream cosign v2→v3. Story 8.3 pass-2 F8:
      # installer step guarded by digest-non-empty for consistency with
      # SLSA + SBOM step pattern (defense-in-depth — validate-digest-base
      # above is the primary contract).
      # ---------------------------------------------------------------------
      - name: Install cosign
        if: steps.build.outputs.digest != ''  # F8: matches SLSA/SBOM guard pattern; primary contract is validate-digest-base
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          # F10: pin cosign binary version independently of installer action
          # SHA — guards against silent v2→v3 CLI drift if upstream releases
          # a major bump. Bump deliberately when the verify-images recipe is
          # validated against the new version.
          cosign-release: 'v3.0.6'

      - name: Cosign keyless sign (base)
        id: sign-base  # F12: forward-compat for post-sign verification or structured logging
        if: steps.build.outputs.digest != ''  # defense-in-depth — validate-digest-base above is the primary contract
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-base
        run: |
          # F3: explicit pipefail; F4: re-validate digest format inline for
          # defense-in-depth (validate-digest-base is the primary fail-loud).
          # F14: full image ref moved to env block to avoid inline expression
          # interpolation in shell context.
          set -euo pipefail
          printf '%s' "${DIGEST}" | grep -qE '^sha256:[a-f0-9]{64}$' || {
            echo "::error::Malformed base digest in cosign sign: ${DIGEST}"
            exit 1
          }
          cosign sign --yes "${IMAGE_REF}@${DIGEST}"

      # ---------------------------------------------------------------------
      # Story 8.4 (Phase 2 Epic 8): attach the CycloneDX SBOM as a cosign
      # attestation. Story 8.1 ships the SBOM as a 90-day workflow artifact;
      # this step also attaches it to the image's content digest in GHCR as
      # an unbounded OCI attestation. Together they provide both short-term
      # operator convenience (artifact) and long-term registry-resident
      # discoverability (attestation).
      #
      # Operator verifies the attestation deploy-side:
      #   cosign verify-attestation --type cyclonedx \
      #     --certificate-identity-regexp "^https://github.com/${OWNER}/oh-my-bmad/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$" \
      #     --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
      #     <image>@<digest>
      #
      # The decoded `predicate` field matches the local sbom-base.cyclonedx.json
      # bytes byte-for-byte. See ADR-0008 §"Decision" items 1+6.
      #
      # POLICY: cosign attest runs for ALL tags (stable + prerelease) —
      # same deliberate stance as SLSA (see SLSA step's POLICY comment
      # above). Rekor growth on retry is expected behavior, not a bug
      # (ADR-0008 §F7-extended). Empty-SBOM-file silent-corruption is
      # guarded by the `test -s` precondition below (F4 from Story 8.4
      # code review). Sigstore Fulcio/Rekor outage = hard release block
      # per ADR-0008 §F8.
      # ---------------------------------------------------------------------
      - name: Cosign attest SBOM (base)
        id: attest-sbom-base
        if: steps.build.outputs.digest != ''  # F6 lesson
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -s sbom-base.cyclonedx.json || { echo "::error::SBOM file empty or missing (F4 guard)"; exit 1; }
          cosign attest --yes \
            --predicate sbom-base.cyclonedx.json \
            --type cyclonedx \
            "${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-base@${DIGEST}"

      - name: Upload base SBOM as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-base-${{ steps.ver.outputs.version }}
          path: sbom-base.cyclonedx.json
          retention-days: 90

  build-and-push-services:
    name: Build + push ${{ matrix.service }}
    needs: build-and-push-base
    runs-on: ubuntu-24.04
    timeout-minutes: 40  # bumped 30 → 40 (Phase 2 Story 8.2 SLSA + 8.1 SBOM + Stories 8.3 cosign-sign / 8.4 cosign-attest in flight); matrix variance + 4 supply-chain steps justify ~10 min headroom
    strategy:
      fail-fast: false
      matrix:
        service:
          - registry-api
          - registry-state
          - telegram-gateway
          - orchestrator-adapter
          - worker-wrapper
          - clawhip-daemon
          - console-cli
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4.0.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Build + push ${{ matrix.service }} (multi-arch)
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-${{ matrix.service }}:${{ needs.build-and-push-base.outputs.version }}
          # Pin base-image override to the base's content digest (not the
          # mutable tag) so a re-run or concurrent push can't race the base
          # reference. Emitted by the base build-push-action's step output.
          build-contexts: |
            oh-my-bmad-base:local=docker-image://${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-base@${{ needs.build-and-push-base.outputs.digest }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Tag ${{ matrix.service }} as :latest (stable releases only)
        if: needs.build-and-push-base.outputs.latest_tags != ''
        env:
          SRC: ${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-${{ matrix.service }}:${{ needs.build-and-push-base.outputs.version }}
          DST: ${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-${{ matrix.service }}:latest
        run: |
          docker buildx imagetools create -t "${DST}" "${SRC}"

      # ---------------------------------------------------------------------
      # Story 8.2 (Phase 2 Epic 8): SLSA L2 provenance per service image.
      # Same pattern + same policy as the base-job SLSA step (see comment
      # block above the base step for the canonical verify-attestation
      # command + policy notes on prerelease + outage behavior).
      # Matrix-scoped `steps.build.outputs.digest` is per-service; fail-fast:
      # false on the matrix means one service's SLSA failure isolates to its
      # own matrix entry without aborting siblings.
      #
      # Code-review pass-2 F2+F6: validate-digest-service is the primary
      # contract; the `if:` on the attestation step is defense-in-depth.
      # ---------------------------------------------------------------------
      - name: Validate build digest before attestation (${{ matrix.service }})
        id: validate-digest-service
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -z "${DIGEST}" ]; then
            echo "::error::docker/build-push-action produced empty digest for ${{ matrix.service }} — refusing to publish unattested image (F2)"
            exit 1
          fi
          if ! printf '%s' "${DIGEST}" | grep -qE '^sha256:[a-f0-9]{64}$'; then
            echo "::error::Malformed digest for ${{ matrix.service }}: ${DIGEST} — expected sha256:<64 hex chars> (F6)"
            exit 1
          fi
          printf '%s digest validated: %s\n' "${{ matrix.service }}" "${DIGEST}"

      - name: Generate SLSA L2 provenance attestation (${{ matrix.service }})
        id: attest-service
        if: steps.build.outputs.digest != ''  # defense-in-depth — validate-digest-service above is the primary contract
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # ---------------------------------------------------------------------
      # Story 8.1 (Phase 2 Epic 8): CycloneDX SBOM per service image.
      # See ADR-0008. Stories 8.2-8.4 chain SLSA + cosign sign + attest;
      # Story 8.5 verifies deploy-side. CI fails if SBOM generation fails
      # (fail-fast matrix; one service's SBOM-failure does not block the
      # rest of the matrix per `fail-fast: false`).
      #
      # Code-review pass-2 F5: digest-guard on SBOM step matches the SLSA +
      # cosign step guards for consistency.
      # ---------------------------------------------------------------------
      - name: Generate CycloneDX SBOM (${{ matrix.service }})
        if: steps.build.outputs.digest != ''  # F5: matches the SLSA + cosign step guards
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-${{ matrix.service }}:${{ needs.build-and-push-base.outputs.version }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.service }}.cyclonedx.json
          artifact-name: sbom-${{ matrix.service }}

      # ---------------------------------------------------------------------
      # NFR-S11 / G1: publish-time license-incompatibility gate (per service).
      # Same contract + rationale as the base-job gate above: the CycloneDX
      # SBOM just generated is scanned against the MIT repo license; an
      # incompatible component FAILS this matrix entry (no continue-on-error)
      # so its image is never signed and never published. Policy is reused
      # verbatim from secret_hygiene.license_scan via uv (no forked policy).
      # ---------------------------------------------------------------------
      - name: Install uv + Python 3.12 (license gate)
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.12"

      - name: Sync workspace (license gate)
        run: uv sync --frozen

      - name: License-incompatibility gate (NFR-S11 / FR40 publish-time)
        run: uv run python scripts/check_sbom_licenses.py --sbom sbom-${{ matrix.service }}.cyclonedx.json

      # ---------------------------------------------------------------------
      # Story 8.3 (Phase 2 Epic 8): cosign keyless signing per service image.
      # Same pattern + same policy as the base-job sign step (see comment
      # block above the base step for verify-command + outage policy +
      # pass-2 F1+F3+F8+F10+F11+F12+F14 corrections).
      # ---------------------------------------------------------------------
      - name: Install cosign
        if: steps.build.outputs.digest != ''  # F8: matches SLSA/SBOM guard pattern; primary contract is validate-digest-service
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: 'v3.0.6'  # F10: pin cosign binary version

      - name: Cosign keyless sign (${{ matrix.service }})
        id: sign-service  # F12: forward-compat for post-sign verification
        if: steps.build.outputs.digest != ''  # defense-in-depth — validate-digest-service above is the primary contract
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-${{ matrix.service }}
        run: |
          # F3: explicit pipefail; F4: re-validate digest format inline;
          # F14: image ref via env block (no inline expression in shell context).
          set -euo pipefail
          printf '%s' "${DIGEST}" | grep -qE '^sha256:[a-f0-9]{64}$' || {
            echo "::error::Malformed ${{ matrix.service }} digest in cosign sign: ${DIGEST}"
            exit 1
          }
          cosign sign --yes "${IMAGE_REF}@${DIGEST}"

      # ---------------------------------------------------------------------
      # Story 8.4 (Phase 2 Epic 8): attach the CycloneDX SBOM as a cosign
      # attestation per service image. Same pattern + same policy as the
      # base-job attest step (see comment block above the base step for the
      # canonical verify-attestation command, prerelease policy, F4
      # empty-SBOM guard rationale, and ADR-0008 references).
      # ---------------------------------------------------------------------
      - name: Cosign attest SBOM (${{ matrix.service }})
        id: attest-sbom-service
        if: steps.build.outputs.digest != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -s "sbom-${{ matrix.service }}.cyclonedx.json" || { echo "::error::SBOM file empty or missing for ${{ matrix.service }} (F4 guard)"; exit 1; }
          cosign attest --yes \
            --predicate sbom-${{ matrix.service }}.cyclonedx.json \
            --type cyclonedx \
            "${{ env.REGISTRY }}/${{ env.OWNER }}/oh-my-bmad-${{ matrix.service }}@${DIGEST}"

      - name: Upload ${{ matrix.service }} SBOM as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-${{ matrix.service }}-${{ needs.build-and-push-base.outputs.version }}
          path: sbom-${{ matrix.service }}.cyclonedx.json
          retention-days: 90
