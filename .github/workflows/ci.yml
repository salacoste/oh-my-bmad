name: ci

# release.yml (GHCR multi-arch publish) lands in Story 1.9.
# nightly.yml (full slow-matrix: separability + crash-injection + idempotency replay) deferred.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: the PR gate only reads; no token-backed mutations.
permissions:
  contents: read

# One run per ref. A push to the same branch cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate:
    name: PR gate (ruff + mypy + pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [registry-state-postgres]  # DD-P6-4: Postgres gate required
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.12"

      - name: Sync workspace (incl. dev deps)
        run: uv sync --frozen --dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy --strict (packages + registry services)
        run: uv run mypy --strict --explicit-package-bases packages/ services/registry-api services/registry-state

      - name: Check imports
        run: uv run python scripts/check_imports.py

      - name: Check event registry
        run: uv run python scripts/check_event_registry.py

      - name: Check single writer
        run: uv run python scripts/check_single_writer.py

      - name: Check registry isolation
        run: uv run python scripts/check_registry_isolation.py

      - name: Check MCP transport (P2-I4 stdio-only)
        run: uv run python scripts/check_mcp_transport.py

      - name: Check trace_id required (NFR-O7)
        run: uv run python scripts/check_trace_id_required.py

      - name: Check tier declarations (P3-I1)
        run: uv run python scripts/check_tier_declarations.py

      - name: Check retention policy readiness (Story 130.1)
        run: uv run python scripts/check_retention_policy_readiness.py

      - name: Check production credentials (Story 131.2)
        run: uv run python scripts/check_production_credentials.py

      - name: Check GitHub write activation readiness (Story 131.3)
        run: uv run python scripts/check_github_write_activation.py

      - name: Check deployment change readiness (Story 131.4)
        run: uv run python scripts/check_deployment_change_readiness.py

      - name: Check production command surface readiness (Story 131.5)
        run: uv run python scripts/check_production_command_surface.py

      - name: Check production operations closure (Story 131.6)
        run: uv run python scripts/check_production_operations_closure.py

      - name: Check split deployment topology readiness (Story 132.1)
        run: uv run python scripts/check_split_deployment_topology.py

      - name: Check DB mTLS readiness (Epic 133)
        run: uv run python scripts/check_db_mtls_readiness.py

      - name: Check-scripts self-tests
        run: |
          uv run python scripts/check_imports.py --self-test
          uv run python scripts/check_event_registry.py --self-test
          uv run python scripts/check_single_writer.py --self-test
          uv run python scripts/check_registry_isolation.py --self-test
          uv run python scripts/check_mcp_transport.py --self-test
          uv run python scripts/check_trace_id_required.py --self-test
          uv run python scripts/check_tier_declarations.py --self-test
          uv run python scripts/check_sbom_licenses.py --self-test
          uv run python scripts/check_retention_policy_readiness.py --self-test
          uv run python scripts/check_production_credentials.py --self-test
          uv run python scripts/check_github_write_activation.py --self-test
          uv run python scripts/check_deployment_change_readiness.py --self-test
          uv run python scripts/check_production_command_surface.py --self-test
          uv run python scripts/check_production_operations_closure.py --self-test
          uv run python scripts/check_split_deployment_topology.py --self-test
          uv run python scripts/check_db_mtls_readiness.py --self-test

      - name: Check secrets (full tree)
        run: git ls-files -z | xargs -0 uv run secret-hygiene-precommit

      - name: pytest -m "not slow"
        run: uv run pytest -m "not slow"

  # Required: Postgres matrix must pass alongside SQLite (DD-P6-4).
  registry-state-postgres:
    name: Registry-state tests (Postgres service container)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.12"

      - name: Sync workspace (incl. dev deps)
        run: uv sync --frozen --dev

      - name: pytest registry-state (Postgres)
        env:
          REGISTRY_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
        run: uv run pytest services/registry-state/ -v
