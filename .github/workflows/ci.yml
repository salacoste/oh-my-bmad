name: ci

# release.yml (GHCR multi-arch publish) lands in Story 1.9.
# nightly.yml (full slow-matrix: separability + crash-injection + idempotency replay) deferred.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: the PR gate only reads; no token-backed mutations.
permissions:
  contents: read

# One run per ref. A push to the same branch cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate:
    name: PR gate (ruff + mypy + pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync workspace (incl. dev deps)
        run: uv sync --frozen --dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy --strict (packages + registry services)
        run: uv run mypy --strict packages/ services/registry-api services/registry-state

      - name: Check imports
        run: uv run python scripts/check_imports.py

      - name: Check event registry
        run: uv run python scripts/check_event_registry.py

      - name: Check single writer
        run: uv run python scripts/check_single_writer.py

      - name: Check-scripts self-tests
        run: |
          uv run python scripts/check_imports.py --self-test
          uv run python scripts/check_event_registry.py --self-test
          uv run python scripts/check_single_writer.py --self-test

      - name: Check secrets (full tree)
        run: git ls-files -z | xargs -0 uv run secret-hygiene-precommit

      - name: pytest -m "not slow"
        # Tolerate aiosqlite daemon-thread teardown SIGABRT (exit 134) AFTER
        # pytest reports a clean pass. The cyextension/aiosqlite stack races
        # with Python's interpreter shutdown — the test outcomes are already
        # printed by the time the fatal error fires. We only forgive 134 if
        # pytest's own summary line shows passed AND zero failed.
        run: |
          # GHA runs `bash -e` by default. Disable `-e` so the script
          # survives pytest exiting 134 and gets to the tolerance check.
          set +e
          set -o pipefail
          uv run pytest -m "not slow" 2>&1 | tee /tmp/pytest-out.log
          rc=${PIPESTATUS[0]}
          # Extract the canonical pytest summary line: "=== N passed, M skipped... ===".
          # Match it, then assert it contains "passed" and does NOT contain "failed".
          summary=$(grep -E '^=+ [0-9]+ (passed|failed)' /tmp/pytest-out.log | tail -1)
          if [ "$rc" -eq 134 ] && \
             echo "$summary" | grep -q 'passed' && \
             ! echo "$summary" | grep -q 'failed'; then
            echo "::notice::Tolerating SIGABRT from aiosqlite daemon-thread teardown."
            echo "::notice::Summary line: $summary"
            exit 0
          fi
          exit "$rc"
