[project]
name = "console-cli"
version = "0.2.0"
description = "Local console CLI (Typer) for operator commands. Surface parity with Telegram per FR12."
authors = [
    { name = "R2d2", email = "bad.vano23ru@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.21.0",
    "structlog>=24.1",
    "httpx>=0.27",
    "pydantic-settings>=2.5,<3.0",
    "secret-hygiene",
    "events",
]

[project.scripts]
oh-my-bmad-cli = "console_cli.__main__:app"

[build-system]
requires = ["uv_build>=0.11.0,<1.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.uv.sources]
secret-hygiene = { workspace = true }
events = { workspace = true }

[tool.uv.build-backend]
source-exclude = [
    "**/test_*.py",
    "**/conftest.py",
]
