[project]
name = "orchestrator-adapter"
version = "0.2.0"
description = "OMC subprocess supervision + platform-task → OMC-task contract translation."
authors = [
    { name = "R2d2", email = "bad.vano23ru@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "events",
    "structlog>=24.1",
    "pydantic-settings>=2.5,<3.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<1.0"]
build-backend = "uv_build"
