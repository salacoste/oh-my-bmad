[project]
name = "metrics-subscriber"
version = "0.1.0"
description = "β derived-metrics subscriber: read-only Prometheus exposition over JSONL event log (no parallel instrumentation per NFR-O1)."
authors = [
    { name = "R2d2", email = "bad.vano23ru@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "structlog>=24.1",
    "pydantic-settings>=2.5,<3.0",
    "events",
    # Story 10.3 AC1 — FastAPI factory + Prometheus exposition surface
    # (FR61). Versions tracked against ``services/registry-api`` so the
    # two FastAPI services stay binary-compatible under shared uvicorn.
    "prometheus-client>=0.20,<1.0",
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30,<0.35",
    # Story 57 — mTLS TLS context factory for server-side TLS.
    "mtls",
]

[build-system]
requires = ["uv_build>=0.11.0,<1.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    # Story 10.3 AC1 — in-process FastAPI test client via ``ASGITransport``
    # + lifespan exercise for the NFR-O8 benchmark.  ``asgi-lifespan`` is
    # already provided at the workspace root; declared here for explicit
    # provenance per the import-graph guard convention.
    "httpx>=0.27",
    "pytest-benchmark>=4.0",
    "asgi-lifespan>=2.1",
]

[tool.uv.sources]
events = { workspace = true }
mtls = { workspace = true }
