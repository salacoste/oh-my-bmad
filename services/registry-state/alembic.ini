# Alembic configuration for registry-state SQLite store.
# DB URL is NOT hardcoded here — set at runtime via the REGISTRY_STATE_DB_URL
# env var (read in migrations/env.py). The sqlalchemy.url placeholder below
# is overridden by env.py before any connection is made.

[alembic]
# Path to the migrations directory. %(here)s expands to the directory
# containing this alembic.ini file (i.e. services/registry-state/).
script_location = %(here)s/src/registry_state/migrations

# Revision file naming. Follows Arch line-302:
#   <YYYY-MM-DD>_<numeric-prefix>_<slug>.py
# The numeric prefix ensures stable ordering when multiple migrations
# land on the same calendar day.
file_template = %%(year)d-%%(month).2d-%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for generated file timestamps.
timezone = UTC

# Alembic will look for this section when connecting via env.py.
# The URL is overridden at runtime — this value is a non-functional placeholder.
sqlalchemy.url = sqlite+aiosqlite:///:memory:

[post_write_hooks]
# No post-write hooks configured.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
