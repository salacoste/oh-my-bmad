[project]
name = "registry-api"
version = "0.3.0"
description = "HTTP application API surface for the oh-my-bmad task + session registry. Story 2.9 ships FastAPI app + POST /v1/tasks + GET /v1/tasks/{id} (FR1 + FR4 + FR26). Story 2.13 wires IdempotencyCacheStore into POST /v1/tasks (FR28 + NFR-R4)."
authors = [
    { name = "R2d2", email = "bad.vano23ru@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    # Story 11.1 — env-var loading for OPERATOR_HMAC_KEY (FR64 / NFR-S10).
    # First pydantic-settings consumer in registry-api; previously all
    # config was threaded through ``build_app(...)`` keywords.
    "pydantic-settings>=2.0",
    "events>=0.3.0",
    "registry-state>=0.5.0",
    "idempotency>=0.2.0,<0.3.0",
    # Story 2.13 review C3 — direct use for the bounded response-body
    # side-channel cache. ``idempotency`` already pulls cachetools but
    # the in-process side-channel is owned by registry-api, so the dep
    # is declared explicitly to avoid relying on a transitive.
    "cachetools>=5.3",
    # Story 3.6 AC-13 — explicit declaration. ``secret-hygiene`` already
    # pulls structlog transitively, but ``registry_api.adapters.middleware``
    # imports it directly (AC-1) and ``__main__.py`` configures the
    # processor chain (AC-4); the import-graph guard prefers explicit
    # over transitive deps.
    "structlog>=24.1",
    # Story 3.6 AC-4 — log sanitizer is a structlog processor.
    "secret-hygiene",
    # Story 7.3 — Anthropic SDK for LLM-powered task event digests (FR5).
    "anthropic>=0.100",
    # Story 6.1+ — JWT authentication for registry API (replaces X-Actor-Id
    # header trust). PyJWT provides encode/decode with HS256/RS256 support.
    "pyjwt>=2.8",
]

[build-system]
requires = ["uv_build>=0.11.0,<1.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "httpx>=0.27",
]

[tool.uv.sources]
events = { workspace = true }
registry-state = { workspace = true }
idempotency = { workspace = true }
