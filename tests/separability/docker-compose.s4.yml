# Story 10.6 — S-4 separability harness compose overlay (FR62a / NFR-M4/M5).
#
# Self-contained 6-service stack mirroring docker-compose.yml MINUS the
# metrics-subscriber service. Used by
# tests/separability/test_s4_metrics_subscriber_optional.py (Phase 2) to
# prove that REMOVING the metrics-subscriber does NOT introduce any new
# hidden dependency in the producer services (NFR-M4/M5 discipline
# extended; FR62a satisfied — adding the subscriber to the stack must
# not retroactively make the rest of the stack require it).
#
# Phase 1 of the same test uses the ROOT docker-compose.yml (which DOES
# include metrics-subscriber, default-ON per Epic 10 goal). Phase 2 uses
# THIS overlay (without metrics-subscriber). Both phases must reach
# healthy state and serve identical HTTP responses on registry-api's
# /v1/health + POST /v1/tasks.
#
# Decision D1 (Path A overlay) — chosen over `profiles:` (Path B) to
# match S-1/S-2/S-3 convention; cleaner Docker semantics; no env-var
# pollution. The root docker-compose.yml ships metrics-subscriber
# ENABLED-by-default; this overlay is the "without it" inverse.
#
# Bind-mount pattern: ${OMB_S4_DATA_DIR} is exported by the harness so
# each test invocation gets a clean tmpfs root (mirrors S-1's
# OMB_S1_DATA_DIR convention; eliminates inter-test data contamination
# without needing `docker volume rm` between phases).

# Story 11.3.6 (H7b) — env vars forwarded to spawned MCP subprocesses via the
# allowlist in services/{orch-adapter,worker-wrapper}/.../mcp_clients.py. Shared
# anchor between orchestrator-adapter + worker-wrapper (s4 overlay copy of the
# same shape in the ROOT compose; literal paths instead of ${REGISTRY_DB_PATH}
# indirection since the s4 test fixes the paths). NEVER list secrets here.
x-mcp-spawner-env: &mcp_spawner_env
  TASK_REGISTRY_DB_PATH: /var/lib/oh-my-bmad/registry/state.sqlite3
  SESSION_REGISTRY_DB_PATH: /var/lib/oh-my-bmad/registry/state.sqlite3
  CLAWHIP_BRIDGE_LOG_DIR: /var/lib/oh-my-bmad/registry/events
  REGISTRY_EVENTS_DIR: /var/lib/oh-my-bmad/registry/events
  REGISTRY_DB_PATH: /var/lib/oh-my-bmad/registry/state.sqlite3
  OMB_MCP_AUDIT_EMISSION_ENABLED: "0"  # H7f — nested-stdio deadlock; see deferred-work.md.

services:
  registry-api:
    container_name: omb-s4-registry-api
    build:
      context: ../..
      dockerfile: services/registry-api/Dockerfile
    image: ${OMB_IMAGE_REGISTRY:-ghcr.io/r2d2}/oh-my-bmad-registry-api:${OMB_VERSION:-dev}
    environment:
      ENV: test
      REGISTRY_API_HOST: 0.0.0.0
      REGISTRY_API_PORT: "8080"
      REGISTRY_API_LOG_DIR: /var/lib/oh-my-bmad/registry/events
      REGISTRY_API_DB_URL: sqlite+aiosqlite:////var/lib/oh-my-bmad/registry/state.sqlite3
      REGISTRY_DB_PATH: /var/lib/oh-my-bmad/registry/state.sqlite3
    init: true
    restart: "no"
    networks: [oh-my-bmad-net]
    ports:
      - "8080"
    volumes:
      - ${OMB_S4_DATA_DIR:?OMB_S4_DATA_DIR must be exported by the harness}:/var/lib/oh-my-bmad
    depends_on:
      registry-state:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket,sys; s=socket.socket(); s.settimeout(1); s.connect(('127.0.0.1', 8080)); s.close()"
      interval: 1s
      timeout: 3s
      retries: 60
      start_period: 5s

  registry-state:
    container_name: omb-s4-registry-state
    build:
      context: ../..
      dockerfile: services/registry-state/Dockerfile
    image: ${OMB_IMAGE_REGISTRY:-ghcr.io/r2d2}/oh-my-bmad-registry-state:${OMB_VERSION:-dev}
    environment:
      ENV: test
      REGISTRY_STATE_LOG_DIR: /var/lib/oh-my-bmad/registry/events
      REGISTRY_STATE_DB_URL: sqlite+aiosqlite:////var/lib/oh-my-bmad/registry/state.sqlite3
      REGISTRY_STATE_AUTO_CREATE_SCHEMA: "1"
      REGISTRY_DB_PATH: /var/lib/oh-my-bmad/registry/state.sqlite3
    init: true
    restart: "no"
    networks: [oh-my-bmad-net]
    volumes:
      - ${OMB_S4_DATA_DIR:?OMB_S4_DATA_DIR must be exported by the harness}:/var/lib/oh-my-bmad
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 1s
      timeout: 3s
      retries: 60
      start_period: 5s

  telegram-gateway:
    container_name: omb-s4-telegram-gateway
    build:
      context: ../..
      dockerfile: services/telegram-gateway/Dockerfile
    image: ${OMB_IMAGE_REGISTRY:-ghcr.io/r2d2}/oh-my-bmad-telegram-gateway:${OMB_VERSION:-dev}
    environment:
      ENV: test
      # Story 11.3.7 (AC2/AC4) — telegram-gateway requires a syntactically
      # valid TELEGRAM_BOT_TOKEN at boot (audited_secret_field rejects ""
      # with ValueError). The dummy <digits>:<alphanumeric> shape satisfies
      # the validator without authorizing real Telegram traffic; combined
      # with TELEGRAM_SKIP_WEBHOOK_SET=1 (AC2 hermetic mode), the lifespan
      # skips bot.set_webhook(...) and the apply_hermetic_defaults_to_env
      # helper fills dummy TELEGRAM_WEBHOOK_URL / TELEGRAM_WEBHOOK_SECRET_TOKEN
      # so settings construction succeeds without those env-vars. Required
      # for the s4 overlay's telegram-gateway (one of the 6 producers in
      # _PRODUCER_SERVICES) to reach healthy in Phase 2. Spec-deviation
      # noted in Story 11.3.7 Dev Agent Record (the literal "keep its
      # empty token" instruction conflicts with audited-secret validation).
      TELEGRAM_BOT_TOKEN: "0:dummytesttoken"
      TELEGRAM_SKIP_WEBHOOK_SET: "1"
      TG_ALLOWLIST_USER_IDS: "[]"
    init: true
    restart: "no"
    networks: [oh-my-bmad-net]
    # Story 11.3.6 (H7d) — telegram-gateway is a uvicorn HTTP server that never
    # creates /tmp/ready; probe the TCP port instead (mirrors the ROOT compose
    # fix). Without this the S-4 Phase-2 healthcheck would never pass.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket,sys\ntry:\n  s=socket.socket(); s.settimeout(1); s.connect(('127.0.0.1', 8080)); s.close()\nexcept OSError:\n  sys.exit(1)"
      interval: 1s
      timeout: 3s
      retries: 60
      start_period: 5s

  orchestrator-adapter:
    container_name: omb-s4-orchestrator-adapter
    build:
      context: ../..
      dockerfile: services/orchestrator-adapter/Dockerfile
    image: ${ORCHESTRATOR_IMAGE:-${OMB_IMAGE_REGISTRY:-ghcr.io/r2d2}/oh-my-bmad-orchestrator-adapter:${OMB_VERSION:-dev}}
    environment:
      # Story 11.3.6 (H7b): MCP-subprocess env via *mcp_spawner_env anchor;
      # identity = orchestrator. Forwarded via the mcp_clients.py allowlist
      # (never os.environ.copy — a0ca050 P0).
      <<: *mcp_spawner_env
      ENV: test
      ANTHROPIC_API_KEY: ""
      TASK_REGISTRY_ACTOR_KIND: orchestrator
      TASK_REGISTRY_ACTOR_ID: orchestrator-adapter
      SESSION_REGISTRY_ACTOR_KIND: orchestrator
      SESSION_REGISTRY_ACTOR_ID: orchestrator-adapter
      CLAWHIP_BRIDGE_ACTOR_KIND: orchestrator
      CLAWHIP_BRIDGE_ACTOR_ID: orchestrator-adapter
    init: true
    restart: "no"
    networks: [oh-my-bmad-net]
    # Story 11.3.6 (H7b): RW data volume so the spawned clawhip-bridge can append
    # the event log; task-registry reads the DB. Wait for registry-state + api.
    depends_on:
      registry-state:
        condition: service_healthy
      registry-api:
        condition: service_healthy
    volumes:
      - ${OMB_S4_DATA_DIR:?OMB_S4_DATA_DIR must be exported by the harness}:/var/lib/oh-my-bmad
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 1s
      timeout: 3s
      retries: 60
      start_period: 5s

  worker-wrapper:
    container_name: omb-s4-worker-wrapper
    build:
      context: ../..
      dockerfile: services/worker-wrapper/Dockerfile
    image: ${OMB_IMAGE_REGISTRY:-ghcr.io/r2d2}/oh-my-bmad-worker-wrapper:${OMB_VERSION:-dev}
    environment:
      # Story 11.3.6 (H7b): MCP-subprocess env via *mcp_spawner_env anchor;
      # identity = worker. (H7h) WORKER_READY_FILE_PATH pins ready-file to
      # /tmp/ready (worker default is per-pid).
      <<: *mcp_spawner_env
      ENV: test
      ANTHROPIC_API_KEY: ""
      GITHUB_TOKEN: ""
      TASK_REGISTRY_ACTOR_KIND: worker
      TASK_REGISTRY_ACTOR_ID: worker-wrapper
      SESSION_REGISTRY_ACTOR_KIND: worker
      SESSION_REGISTRY_ACTOR_ID: worker-wrapper
      CLAWHIP_BRIDGE_ACTOR_KIND: worker
      CLAWHIP_BRIDGE_ACTOR_ID: worker-wrapper
      WORKER_READY_FILE_PATH: /tmp/ready
    init: true
    restart: "no"
    networks: [oh-my-bmad-net]
    # Story 11.3.6 (H7b): RW (was :ro) so the spawned clawhip-bridge can append
    # the event log. Wait for registry-state (DB/schema) + registry-api.
    depends_on:
      registry-state:
        condition: service_healthy
      registry-api:
        condition: service_healthy
    volumes:
      - ${OMB_S4_DATA_DIR:?OMB_S4_DATA_DIR must be exported by the harness}:/var/lib/oh-my-bmad
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 1s
      timeout: 3s
      retries: 60
      start_period: 5s

  clawhip-daemon:
    container_name: omb-s4-clawhip-daemon
    build:
      context: ../..
      dockerfile: services/clawhip-daemon/Dockerfile
    image: ${OMB_IMAGE_REGISTRY:-ghcr.io/r2d2}/oh-my-bmad-clawhip-daemon:${OMB_VERSION:-dev}
    environment:
      ENV: test
      REGISTRY_DB_PATH: /var/lib/oh-my-bmad/registry/state.sqlite3
      # Story 11.3.7 (AC4 / H7e) — clawhip-daemon validates TELEGRAM_BOT_TOKEN
      # format at boot (services/clawhip-daemon/.../main.py:231-242) and
      # sys.exit(2) without a valid <digits>:<alphanumeric> shape. The S-4
      # harness does NOT exercise the real Telegram outbound path, so a
      # syntactically-valid dummy is sufficient + production-safe (regex
      # matches; no real Telegram traffic is generated under the harness).
      # ALSO applied to telegram-gateway above (line 119) — see Story 11.3.7
      # Dev Agent Record / Spec deviation #1: the spec said "do NOT change
      # telegram-gateway's empty token", but audited_secret_field rejects
      # empty strings with ValueError, and _PRODUCER_SERVICES requires
      # telegram-gateway healthy in BOTH phases (AC5). So the dummy token
      # gates settings construction on BOTH services; the AC2 hermetic
      # skip-mode (TELEGRAM_SKIP_WEBHOOK_SET=1 on telegram-gateway) gates
      # set_webhook independently of the token.
      TELEGRAM_BOT_TOKEN: "0:dummytesttoken"
    init: true
    restart: "no"
    networks: [oh-my-bmad-net]
    volumes:
      - ${OMB_S4_DATA_DIR:?OMB_S4_DATA_DIR must be exported by the harness}:/var/lib/oh-my-bmad:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 1s
      timeout: 3s
      retries: 60
      start_period: 5s

  # NO metrics-subscriber — that's the point of this overlay.
  # The test (test_s4_metrics_subscriber_optional.py Phase 2) asserts
  # that all 6 services above reach `Up (healthy)` and that
  # registry-api serves /v1/health + POST /v1/tasks identically to
  # Phase 1 (root compose with 7 services including metrics-subscriber).

networks:
  oh-my-bmad-net:
    driver: bridge
