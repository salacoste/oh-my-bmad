[project]
name = "auto-approval-stub"
version = "0.1.0"
description = "Auto-approval stub (test fixture). Monitors JSONL event log for task.awaiting_approval events and automatically emits approval.granted via clawhip-bridge. Used by the Journey 1 integration test (Story 5.18 / FR31 / NFR-R6)."
authors = [
    { name = "R2d2", email = "bad.vano23ru@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "structlog>=24.0.0",
    "pydantic-settings>=2.0.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<1.0"]
build-backend = "uv_build"
