[project]
name = "oh-my-bmad"
version = "0.1.0"
description = "Self-hosted personal autonomous development platform — Telegram + Console control over swappable CLI coding agents."
authors = [
    { name = "R2d2", email = "R2d2@users.noreply.github.com" },
]
requires-python = ">=3.12"
dependencies = [
    "artifact-mcp",
    "browser-mcp",
    "capabilities",
    "clawhip-bridge-mcp",
    "clawhip-daemon",
    "console-cli",
    "events",
    "git-mcp",
    "github-mcp",
    "idempotency",
    "memory-mcp",
    "metrics-subscriber",
    "orchestrator-adapter",
    "registry-api",
    "registry-state",
    "secret-hygiene",
    "session-registry-mcp",
    "task-registry-mcp",
    "telegram-gateway",
    "verification-mcp",
    "worker-wrapper",
]

[build-system]
requires = ["uv_build>=0.11.0,<1.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.5"

[tool.uv.workspace]
members = ["services/*", "packages/*", "mcp-servers/*"]

[tool.uv.sources]
artifact-mcp = { workspace = true }
browser-mcp = { workspace = true }
capabilities = { workspace = true }
clawhip-bridge-mcp = { workspace = true }
clawhip-daemon = { workspace = true }
console-cli = { workspace = true }
events = { workspace = true }
git-mcp = { workspace = true }
github-mcp = { workspace = true }
idempotency = { workspace = true }
memory-mcp = { workspace = true }
metrics-subscriber = { workspace = true }
orchestrator-adapter = { workspace = true }
registry-api = { workspace = true }
registry-state = { workspace = true }
secret-hygiene = { workspace = true }
session-registry-mcp = { workspace = true }
task-registry-mcp = { workspace = true }
telegram-gateway = { workspace = true }
verification-mcp = { workspace = true }
worker-wrapper = { workspace = true }

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "ruff",
    "mypy",
    "pre-commit",
    "types-cachetools>=5.3",
    # Test-only deps elevated from service-level groups so CI's `uv sync`
    # at the workspace root materialises them for `pytest -m "not slow"`.
    "asgi-lifespan>=2.1",
    "httpx>=0.27",
    # Story 14.2 (NFR-O11) — mutation-testing harness. cosmic-ray mutates
    # source IN PLACE under VCS (mutmut copies to mutants/ that this uv
    # workspace's editable installs never resolve to → false 0%). Nightly
    # `mutation-baseline` job only; not on the PR-gate path.
    "cosmic-ray>=8.4.6",
]

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "services", "mcp-servers"]
asyncio_mode = "strict"
# Story 8.7.6 — module-scoped asyncio loop reduces aiosqlite daemon-thread
# accumulation from ~2376 (per-test loops) to ~30-50 (per-module loops).
# Each pytest-asyncio test previously got its own event loop; aiosqlite's
# Connection.__init__ spawns a daemon worker thread per connection that
# captures a reference to the current loop. Across 2376 tests with FastAPI
# app fixtures, thousands of daemon threads accumulated and raced Python's
# stderr-buffer teardown at interpreter shutdown, causing exit 134 SIGABRT
# AFTER pytest's clean-pass summary. Reusing one loop per module bounds
# the worker-thread count to ~30-50; combined with the pytest_sessionfinish
# drain hook in repo-root conftest.py (Story 8.7.6 PP1/PP3/PP6), this
# reduces the teardown race enough to let us drop the exit-134 tolerance
# shim from .github/workflows/ci.yml (commits 011ced6 / c3d8222 / a0c53bb,
# Epic 8.7 L3 lesson).
asyncio_default_fixture_loop_scope = "module"
addopts = "-ra --strict-markers --import-mode=importlib"
# Story 9.7 pass-1 PM-B12: filterwarnings restored as empty list (not deleted).
# Story 9.7 pass-2 TM-B11: ratchet future deprecations as errors so we don't
# silently regress the Phase-2-clean baseline established by AC13/AC2. The
# error filters target our owned packages (events, registry_state) — third-
# party libs are not gated (they may legitimately emit deprecations during
# transitive upgrades).
filterwarnings = [
    "error::DeprecationWarning:events",
    "error::DeprecationWarning:events.*",
    "error::DeprecationWarning:registry_state",
    "error::DeprecationWarning:registry_state.*",
]
markers = [
    "slow: exclude from PR-gate CI; runs on merge / nightly",
    "separability: S-1/S-2/S-3 adapter-swap tests",
    "crash: NFR-R2 crash-injection harness",
    "idempotency: UUIDv7-key replay tests",
    "integration: cross-service journey tests",
    "contract: upstream-fork behavioral contracts",
    "migrator: event-log schema migrator tests",
    "fuzz: NFR-S5 hypothesis fuzz tests (per-strategy: PR gate; combined 10K: nightly only via @slow)",
    "benchmark: Story 10.3 NFR-O8 /metrics latency benchmark (gates p95<100ms; @slow co-marker)",
]
norecursedirs = [
    ".git",
    ".venv",
    ".uv",
    ".tmp",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "upstream",
    "_bmad",
    "_bmad-output",
    "node_modules",
    ".agent",
    ".agents",
    ".claude",
    ".cursor",
    ".gemini",
    ".opencode",
    ".pi",
    ".omc",
    # Fixture payloads for CI-gate check scripts -- not pytest tests.
    "scripts/checks/fixtures",
]
# NOTE: mypy configuration lives in mypy.ini at repo root (canonical).
# scancode.* import suppression is configured there via [mypy-scancode.*].
