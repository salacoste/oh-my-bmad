[project]
name = "oh-my-bmad"
version = "0.1.0"
description = "Self-hosted personal autonomous development platform — Telegram + Console control over swappable CLI coding agents."
authors = [
    { name = "R2d2", email = "R2d2@users.noreply.github.com" },
]
requires-python = ">=3.12"
dependencies = [
    "capabilities",
    "clawhip-bridge-mcp",
    "clawhip-daemon",
    "console-cli",
    "events",
    "idempotency",
    "orchestrator-adapter",
    "registry-api",
    "registry-state",
    "secret-hygiene",
    "session-registry-mcp",
    "task-registry-mcp",
    "telegram-gateway",
    "worker-wrapper",
]

[build-system]
requires = ["uv_build>=0.11.0,<1.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.5"

[tool.uv.workspace]
members = ["services/*", "packages/*", "mcp-servers/*"]

[tool.uv.sources]
capabilities = { workspace = true }
clawhip-bridge-mcp = { workspace = true }
clawhip-daemon = { workspace = true }
console-cli = { workspace = true }
events = { workspace = true }
idempotency = { workspace = true }
orchestrator-adapter = { workspace = true }
registry-api = { workspace = true }
registry-state = { workspace = true }
secret-hygiene = { workspace = true }
session-registry-mcp = { workspace = true }
task-registry-mcp = { workspace = true }
telegram-gateway = { workspace = true }
worker-wrapper = { workspace = true }

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "ruff",
    "mypy",
    "pre-commit",
    "types-cachetools>=5.3",
    # Test-only deps elevated from service-level groups so CI's `uv sync`
    # at the workspace root materialises them for `pytest -m "not slow"`.
    "asgi-lifespan>=2.1",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "services", "mcp-servers"]
asyncio_mode = "strict"
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "slow: exclude from PR-gate CI; runs on merge / nightly",
    "separability: S-1/S-2/S-3 adapter-swap tests",
    "crash: NFR-R2 crash-injection harness",
    "idempotency: UUIDv7-key replay tests",
    "integration: cross-service journey tests",
    "contract: upstream-fork behavioral contracts",
    "migrator: event-log schema migrator tests",
    "fuzz: NFR-S5 hypothesis fuzz tests (per-strategy: PR gate; combined 10K: nightly only via @slow)",
]
# Story 9.1 transition filter: existing EventEnvelope.create(...) callsites
# now emit a DeprecationWarning until Stories 9.2-9.6 wire trace_id through
# every entry point. Suppress here so the warning doesn't drown CI logs;
# the dedicated test_envelope.py::TestTraceIdDeprecationWarning suite still
# exercises the warning via pytest.warns(). Remove this line in Story 9.7
# (1.0.0 → 1.1.0 bump makes trace_id mandatory, so the absent-trace_id
# path no longer exists).
#
# Pass-2 review (code-review N2): Python's `warnings.filterwarnings`
# already start-anchors the message regex via `re.match`, so a leading
# `^` is redundant. The real protection against future identically-
# prefixed warnings is a TAIL anchor — we pin on the trailing semicolon
# of the actual message so `EventEnvelope created without trace_id_v2`
# would NOT match. Module qualifier omitted: stacklevel=2 in the
# warnings.warn() call means the "source module" pytest sees is the
# CALLER (services/*, mcp-servers/*), not packages/events/, so a
# module-qualified filter wouldn't match anything.
filterwarnings = [
    "ignore:EventEnvelope created without trace_id;.*\\Z:DeprecationWarning",
]
norecursedirs = [
    ".git",
    ".venv",
    ".uv",
    ".tmp",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "upstream",
    "_bmad",
    "_bmad-output",
    "node_modules",
    ".agent",
    ".agents",
    ".claude",
    ".cursor",
    ".gemini",
    ".opencode",
    ".pi",
    ".omc",
    # Fixture payloads for CI-gate check scripts -- not pytest tests.
    "scripts/checks/fixtures",
]
# NOTE: mypy configuration lives in mypy.ini at repo root (canonical).
# scancode.* import suppression is configured there via [mypy-scancode.*].
