[project]
name = "migrator"
version = "0.1.0"
description = "oh-my-bmad event-log schema migrator. One-shot container. Invoked via `python -m migrator <from>-to-<to>` or via `docker compose run --rm migrator <from>-to-<to>` (compose wiring in Story 1.4)."
authors = [
    { name = "R2d2", email = "bad.vano23ru@gmail.com" },
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.0,<1.0"]
build-backend = "uv_build"
