[mypy]
python_version = 3.12
strict = True
explicit_package_bases = True
exclude = (?x)(
      ^upstream/
    | ^_bmad/
    | ^_bmad-output/
    | ^\.venv/
    | ^scripts/migrator/
    | ^node_modules/
  )

[mypy-tests.*]
ignore_errors = True

[mypy-upstream.*]
ignore_errors = True

[mypy-services.orchestrator_adapter.adapters.*]
ignore_errors = True

[mypy-services.worker_wrapper.adapters.*]
ignore_errors = True
