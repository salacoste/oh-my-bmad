[mypy]
python_version = 3.12
strict = True
# mypy_path: ':' separator is POSIX-only. The platform supports
# Linux/macOS only per FR48; we intentionally do NOT use the multi-line
# (per-entry) form because mypy's INI continuation parsing for that form
# silently drops entries 2..N (verified via ``mypy -vv`` in Story 2.14).
#
# History (Story 2.14 code-review fix C2): pre-2.14 the mypy_path was
# 6 entries on the multi-line form. Story 2.14 collapsed it to a single
# line (workaround for the parsing bug) AND added two new entries:
#   - services/worker-wrapper/src — was MISSING pre-2.14 (Story 2.12's
#     strict-mypy claim resolved worker-wrapper imports via the uv
#     workspace install, NOT via mypy_path; flagged for retrospective
#     in story Spec Amendments — verified that workspace-install path
#     does provide strict resolution, so 2.12's lint claim was correct
#     in effect, but the mypy_path entry was silently absent).
#   - scripts/migrator/src — new for 2.14 (the migrator is NOT a uv
#     workspace member; it's a one-shot Docker container — so mypy_path
#     is the ONLY way it reaches mypy).
mypy_path = packages/capabilities/src:packages/events/src:packages/idempotency/src:packages/mcp_auth/src:packages/mtls/src:packages/replay/src:packages/secret-hygiene/src:services/registry-api/src:services/registry-state/src:services/worker-wrapper/src:mcp-servers/clawhip-bridge/src:scripts/migrator/src
exclude = (?x)(
      ^upstream/
    | ^_bmad/
    | ^_bmad-output/
    | ^\.venv/
    | ^node_modules/
  )

[mypy-tests.*]
ignore_errors = True

# Story 2.11 / 2.12 / 2.13 — re-enable strict checking on hand-curated
# test trees that need to lock in their type-safety contracts. Override
# the broader [mypy-tests.*] ignore_errors above. mypy module-name
# normalization replaces dashes with underscores, so tests/crash-injection/
# becomes tests.crash_injection.* and tests/idempotency/ becomes
# tests.idempotency.*.
[mypy-tests.crash_injection.*]
ignore_errors = False

[mypy-tests.idempotency.*]
ignore_errors = False

[mypy-tests.migrator.*]
ignore_errors = False

# Story 2.15 — S-3 separability harness (test tree + null-orchestrator
# fixture). Module-name normalization replaces dashes with underscores:
# ``tests/fixtures/null-orchestrator/`` becomes ``tests.fixtures.null_orchestrator``.
[mypy-tests.separability.*]
ignore_errors = False

[mypy-tests.fixtures.null_orchestrator.*]
ignore_errors = False

[mypy-upstream.*]
ignore_errors = True

# Adapter shim boundaries — upstream forks land here in Stories 2.8 / 5.10.
# mypy resolves by DISTRIBUTION MODULE NAME (no `services.` prefix).
[mypy-orchestrator_adapter.adapters.*]
ignore_errors = True

[mypy-worker_wrapper.adapters.*]
ignore_errors = True

# clawhip-daemon and telegram-gateway also host adapter code.
[mypy-clawhip_daemon.adapters.*]
ignore_errors = True

[mypy-telegram_gateway.adapters.*]
ignore_errors = True

# scancode-toolkit is an OPTIONAL runtime dep (gracefully degraded via
# ImportError catch in packages/secret-hygiene/src/secret_hygiene/license_scan.py).
# No published type stubs; suppress import-not-found here.
[mypy-scancode.*]
ignore_missing_imports = True

# asgi-lifespan is a test-only dep (service-level dev group in
# services/registry-api/pyproject.toml). No published type stubs.
# Resolution differs between local workspace install and CI's mypy
# strict gate; suppress at the module level rather than per-import.
[mypy-asgi_lifespan]
ignore_missing_imports = True
