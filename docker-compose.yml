# oh-my-bmad platform — Linux baseline.
#
# Tunnel ingress: operator runs Cloudflared / ngrok / BYO reverse proxy on the
# HOST (not in compose). The tunnel forwards to telegram-gateway on the compose
# network. No host ports exposed (NFR-S7: docker-network is the trust boundary).
#
# macOS operators merge `-f docker-compose.macos.yml` on top — the overlay
# bind-mounts the data volume to ${HOME}/.oh-my-bmad because Docker Desktop
# sandboxes /var/lib/.
#
# Secret scoping: each service declares only the env vars it consumes (FR48,
# least-privilege). `.env` at repo root holds the values; env_file is marked
# required: false so `docker compose config` works on a fresh clone before
# `cp .env.example .env`.
#
# FR52 upgrade path: every service has an `image:` tag alongside `build:`.
# `docker compose build` tags the local image; Story 1.9's release workflow
# publishes to GHCR; operators bump `${VERSION}` in .env and run
# `docker compose pull && up -d` to upgrade.

name: omb

x-common-env: &common-env
  ENV: ${ENV:-development}

x-healthcheck: &healthcheck
  test: ["CMD", "test", "-f", "/tmp/ready"]
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

services:
  registry-api:
    container_name: omb-registry-api
    build:
      context: .
      dockerfile: services/registry-api/Dockerfile
    image: ${OMB_IMAGE_REGISTRY:-ghcr.io/r2d2}/oh-my-bmad-registry-api:${OMB_VERSION:-dev}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *common-env
      REGISTRY_DB_PATH: ${REGISTRY_DB_PATH:-/var/lib/oh-my-bmad/registry/state.sqlite3}
    init: true
    restart: unless-stopped
    networks: [oh-my-bmad-net]
    volumes:
      - oh-my-bmad-data:/var/lib/oh-my-bmad:ro
    healthcheck: *healthcheck

  registry-state:
    container_name: omb-registry-state
    build:
      context: .
      dockerfile: services/registry-state/Dockerfile
    image: ${OMB_IMAGE_REGISTRY:-ghcr.io/r2d2}/oh-my-bmad-registry-state:${OMB_VERSION:-dev}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *common-env
      REGISTRY_DB_PATH: ${REGISTRY_DB_PATH:-/var/lib/oh-my-bmad/registry/state.sqlite3}
      # Story 11.3.5: env-driven, default OFF in production (unchanged — schema
      # comes from the operator/migrator's `alembic upgrade head`, Story 2.14).
      # Self-contained test stacks (S-4 separability) export =1 to bootstrap the
      # schema in-process, mirroring the S-1/S-2/S-3 test composes. Empty/unset
      # → registry-state's `== "1"` check is False → no-op.
      REGISTRY_STATE_AUTO_CREATE_SCHEMA: ${REGISTRY_STATE_AUTO_CREATE_SCHEMA:-}
    init: true
    restart: unless-stopped
    networks: [oh-my-bmad-net]
    volumes:
      - oh-my-bmad-data:/var/lib/oh-my-bmad
    healthcheck: *healthcheck

  telegram-gateway:
    container_name: omb-telegram-gateway
    build:
      context: .
      dockerfile: services/telegram-gateway/Dockerfile
    image: ${OMB_IMAGE_REGISTRY:-ghcr.io/r2d2}/oh-my-bmad-telegram-gateway:${OMB_VERSION:-dev}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *common-env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TG_ALLOWLIST_USER_IDS: ${TG_ALLOWLIST_USER_IDS:-}
    init: true
    restart: unless-stopped
    networks: [oh-my-bmad-net]
    healthcheck: *healthcheck

  orchestrator-adapter:
    container_name: omb-orchestrator-adapter
    build:
      context: .
      dockerfile: services/orchestrator-adapter/Dockerfile
    # Story 2.15 / FR35 / NFR-M5 — orchestrator pass-through swap.
    # ``ORCHESTRATOR_IMAGE`` env-var indirection lets operators (and the S-3
    # separability test) replace the default orchestrator-adapter image with
    # any compatible image (e.g. ``null-orchestrator:latest``) via a single
    # variable. When unset, the default tag below is used so operator
    # behavior is unchanged. The ``build:`` directive remains so
    # ``docker compose build`` still tags the local default image — the
    # alternative image is built separately by its own pipeline (the S-3
    # test harness builds ``null-orchestrator:latest`` itself).
    image: ${ORCHESTRATOR_IMAGE:-${OMB_IMAGE_REGISTRY:-ghcr.io/r2d2}/oh-my-bmad-orchestrator-adapter:${OMB_VERSION:-dev}}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *common-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    init: true
    restart: unless-stopped
    networks: [oh-my-bmad-net]
    healthcheck: *healthcheck

  worker-wrapper:
    container_name: omb-worker-wrapper
    build:
      context: .
      dockerfile: services/worker-wrapper/Dockerfile
    image: ${OMB_IMAGE_REGISTRY:-ghcr.io/r2d2}/oh-my-bmad-worker-wrapper:${OMB_VERSION:-dev}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *common-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      REGISTRY_DB_PATH: ${REGISTRY_DB_PATH:-/var/lib/oh-my-bmad/registry/state.sqlite3}
    init: true
    restart: unless-stopped
    networks: [oh-my-bmad-net]
    volumes:
      - oh-my-bmad-data:/var/lib/oh-my-bmad:ro
    healthcheck: *healthcheck

  clawhip-daemon:
    container_name: omb-clawhip-daemon
    build:
      context: .
      dockerfile: services/clawhip-daemon/Dockerfile
    image: ${OMB_IMAGE_REGISTRY:-ghcr.io/r2d2}/oh-my-bmad-clawhip-daemon:${OMB_VERSION:-dev}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *common-env
      REGISTRY_DB_PATH: ${REGISTRY_DB_PATH:-/var/lib/oh-my-bmad/registry/state.sqlite3}
    init: true
    restart: unless-stopped
    networks: [oh-my-bmad-net]
    volumes:
      - oh-my-bmad-data:/var/lib/oh-my-bmad:ro
    healthcheck: *healthcheck

  # Story 10.6 / FR62a / NFR-M4/M5 — derived-metrics subscriber.
  # Internal-only per P2-I5 (NO `ports:` block) — operator scrapes via
  # SSH tunnel or co-located Prometheus container on the same docker
  # network. Read-only consumer of the JSONL event log written by
  # registry-state (P2-I1). `depends_on: registry-state` ONLY (P2-I3 —
  # subscriber is decoupled from registry-api / worker-wrapper /
  # clawhip-daemon by design; only the JSONL availability gates it).
  #
  # Healthcheck overrides the shared `*healthcheck` anchor (which uses
  # the `/tmp/ready` file-touch convention) — metrics-subscriber's
  # FastAPI surface exposes a JSON `/healthz` probe (Story 10.3) which
  # is purpose-built for compose `service_healthy` gating without
  # touching `/metrics` (a hot path under Prometheus scrape; D3).
  #
  # `restart: unless-stopped` means the subscriber retries on exit
  # codes 2 (cursor schema refused) and 3 (corrupt region) — these
  # are non-transient and will loop, but the matrix is documented in
  # __main__.py and a structured `metrics_subscriber_lifespan_failure`
  # log fires before each exit so operators can intervene.
  metrics-subscriber:
    container_name: omb-metrics-subscriber
    build:
      context: .
      dockerfile: services/metrics-subscriber/Dockerfile
    image: ${OMB_IMAGE_REGISTRY:-ghcr.io/r2d2}/oh-my-bmad-metrics-subscriber:${OMB_VERSION:-dev}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *common-env
      OMB_METRICS_EVENT_LOG_DIR: /var/lib/oh-my-bmad/registry/events
      OMB_METRICS_CURSOR_PATH: /var/lib/oh-my-bmad/metrics-subscriber/cursor.json
      OMB_METRICS_POLL_INTERVAL_S: "${OMB_METRICS_POLL_INTERVAL_S:-0.5}"
      OMB_METRICS_METRICS_HOST: "0.0.0.0"
      OMB_METRICS_METRICS_PORT: "9090"
      OMB_METRICS_RUN_MODE: server
    depends_on:
      registry-state:
        condition: service_healthy
    init: true
    restart: unless-stopped
    networks: [oh-my-bmad-net]
    volumes:
      - oh-my-bmad-data:/var/lib/oh-my-bmad
    healthcheck:
      # D3 — probe /healthz over loopback (NOT /metrics — hot path
      # under Prometheus scrape would skew benchmark numbers and add
      # noise to access logs). The shared `*healthcheck` anchor uses
      # `test -f /tmp/ready`; metrics-subscriber's FastAPI surface
      # does not touch that file, so we override per-service to
      # exercise the real readiness route.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:9090/healthz', timeout=2); sys.exit(0 if r.status==200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Story 2.14 / FR22 / FR50 / NFR-M3 — schema-evolution migrator.
  # One-shot semantics: ``restart: "no"`` so a successful run exits cleanly.
  # ``profiles: ["migrate"]`` keeps it OFF by default — the operator's
  # ``just dev`` (i.e. ``docker compose up -d``) does NOT start the migrator.
  # Activation:
  #   docker compose run --rm migrator v1.0.0-to-v1.0.1
  #   docker compose --profile migrate up migrator
  # Mounts the same ``oh-my-bmad-data`` volume read-write — the migrator
  # writes the new log + archive in-place.
  migrator:
    container_name: omb-migrator
    build:
      context: .
      dockerfile: scripts/migrator/Dockerfile
    image: ${OMB_IMAGE_REGISTRY:-ghcr.io/r2d2}/oh-my-bmad-migrator:${OMB_VERSION:-dev}
    profiles: ["migrate"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *common-env
      EVENT_LOG_PATH: ${EVENT_LOG_PATH:-/var/lib/oh-my-bmad/registry/events/current.jsonl}
    init: true
    restart: "no"
    networks: [oh-my-bmad-net]
    volumes:
      - oh-my-bmad-data:/var/lib/oh-my-bmad

networks:
  oh-my-bmad-net:
    driver: bridge

volumes:
  oh-my-bmad-data:
    driver: local
