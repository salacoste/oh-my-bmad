# oh-my-bmad platform — Linux baseline.
#
# Tunnel ingress: operator runs Cloudflared / ngrok / BYO reverse proxy on the
# HOST (not in compose). The tunnel forwards to telegram-gateway on the compose
# network. No host ports exposed (NFR-S7: docker-network is the trust boundary).
#
# macOS operators merge `-f docker-compose.macos.yml` on top — the overlay
# bind-mounts the data volume to ${HOME}/.oh-my-bmad because Docker Desktop
# sandboxes /var/lib/.
#
# Secret scoping: each service declares only the env vars it consumes (FR48,
# least-privilege). `.env` at repo root holds the values; env_file is marked
# required: false so `docker compose config` works on a fresh clone before
# `cp .env.example .env`.
#
# FR52 upgrade path: every service has an `image:` tag alongside `build:`.
# `docker compose build` tags the local image; Story 1.9's release workflow
# publishes to GHCR; operators bump `${VERSION}` in .env and run
# `docker compose pull && up -d` to upgrade.

name: omb

x-common-env: &common-env
  ENV: ${ENV:-development}

x-healthcheck: &healthcheck
  test: ["CMD", "test", "-f", "/tmp/ready"]
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

# Story 11.3.10 (H7f deep-fix) — healthcheck anchor for the two MCP-spawner
# services (orchestrator-adapter + worker-wrapper). Same `/tmp/ready` file
# convention as `*healthcheck`, but a MUCH larger `start_period`.
#
# Why: both spawners init 3 MCP subprocesses SEQUENTIALLY at startup, each
# capped by `_INIT_TIMEOUT = 30.0` in their respective `adapters/mcp_clients.py`
# (orchestrator-adapter line 19 / worker-wrapper line 16). The legitimate
# worst-case init ceiling is therefore 3 × 30s = 90s BEFORE the service can
# touch `/tmp/ready`. The shared `*healthcheck` window above is only
# start_period(10s) + retries(12) × interval(5s) ≈ 70s — SHORTER than the
# code's own worst-case init time. On a slow host (macOS Docker Desktop's
# subprocess spawn) the 70s window expires mid-init → Docker marks the
# container `unhealthy` while it is still legitimately starting; with
# `restart: unless-stopped` it then oscillates starting→unhealthy→restart
# and never latches `healthy` (the Story 11.3.7 Task-7 "5/7 healthy →
# TimeoutError after 180s" flake).
#
# `start_period` is the correct Docker primitive here: failing probes during
# it do NOT count toward `retries`, so a single slow-but-successful init gets
# the full 100s to finish and write `/tmp/ready`. 100s ≈ the 90s sequential
# `_connect()` ceiling + headroom for the post-init `verify_connectivity()`
# liveness probes (3× `list_tools()`, sub-second on the happy path but NOT
# individually `wait_for`-bounded — see mcp_clients.py `_check_one`) + Python
# interpreter start. Observed live: ~95s to `ready`. Scoped to ONLY these two
# services so the other five (which init fast) keep the tighter shared
# `*healthcheck`.
#
# Merge-key form (`<<: *healthcheck` + override) keeps test/interval/timeout/
# retries in lock-step with the shared anchor — if those are ever tuned on
# `*healthcheck`, this inherits the change automatically (only `start_period`
# is intentionally divergent). [code-review L1]
#
# SHARED-BUDGET CAVEAT [3-lane review]: both spawners currently share the
# SAME init profile (`_INIT_TIMEOUT = 30.0` × 3 sequential MCP servers = 90s),
# so one 100s budget fits both. If EITHER service later changes its
# `_INIT_TIMEOUT`, adds/removes an MCP server, or its post-init
# `verify_connectivity()` `list_tools()` probes (currently NOT
# `wait_for`-bounded) start taking non-trivial time, this shared budget must
# be re-evaluated — or split into per-service anchors. `start_period` only
# suppresses failure-COUNTING during the window; it does NOT cap how long
# init may take, so a genuinely-hung subprocess would sit in `starting`
# indefinitely regardless of this value. The real closure for that class is a
# `wait_for` around the liveness probes in `mcp_clients.py` — deferred to the
# AC3-gated P0 path (needs AC1 Linux nightly evidence + AI-1 3-lane review).
x-healthcheck-mcp: &healthcheck_mcp
  <<: *healthcheck
  start_period: 100s

# Story 11.3.6 (H7d) — HTTP-server healthcheck anchor. Use for any service that
# is a uvicorn/FastAPI server bound to :8080 instead of the `/tmp/ready` file
# convention (which only the tail-loop services follow). Wrapped in try/except
# so retries during startup don't dump a Python traceback per attempt.
x-healthcheck-http: &healthcheck_http
  test:
    - CMD
    - python
    - -c
    - "import socket,sys\ntry:\n  s=socket.socket(); s.settimeout(1); s.connect(('127.0.0.1', 8080)); s.close()\nexcept OSError:\n  sys.exit(1)"
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

# Story 11.3.6 (H7b) — env vars forwarded to spawned MCP subprocesses via the
# allowlist in services/{orch-adapter,worker-wrapper}/.../mcp_clients.py. Shared
# between orchestrator-adapter + worker-wrapper; per-service env overrides only
# the ACTOR_KIND/ACTOR_ID identity vars. NEVER list secrets here.
x-mcp-spawner-env: &mcp_spawner_env
  TASK_REGISTRY_DB_PATH: ${REGISTRY_DB_PATH:-/var/lib/oh-my-bmad/registry/state.sqlite3}
  SESSION_REGISTRY_DB_PATH: ${REGISTRY_DB_PATH:-/var/lib/oh-my-bmad/registry/state.sqlite3}
  CLAWHIP_BRIDGE_LOG_DIR: /var/lib/oh-my-bmad/registry/events
  REGISTRY_EVENTS_DIR: /var/lib/oh-my-bmad/registry/events
  REGISTRY_DB_PATH: ${REGISTRY_DB_PATH:-/var/lib/oh-my-bmad/registry/state.sqlite3}
  # H7f: disable nested audit-emission on the registry MCP children (3-level
  # stdio deadlock when task-registry/session-registry spawn a clawhip-bridge
  # stdio CLIENT from inside their own stdio SERVER). The deep-debug to make
  # audit-ON work in this nesting is deferred — see deferred-work.md.
  OMB_MCP_AUDIT_EMISSION_ENABLED: "0"

services:
  registry-api:
    container_name: omb-registry-api
    build:
      context: .
      dockerfile: services/registry-api/Dockerfile
    image: ${OMB_IMAGE_REGISTRY:-ghcr.io/r2d2}/oh-my-bmad-registry-api:${OMB_VERSION:-dev}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *common-env
      REGISTRY_DB_PATH: ${REGISTRY_DB_PATH:-/var/lib/oh-my-bmad/registry/state.sqlite3}
      # Story 11.3.6 (H7a): registry-api is the event-log WRITER (EventLogWriter)
      # AND opens a writable idempotency-cache engine, so it needs READ-WRITE on
      # the data volume (was :ro → "unable to open database file" crash-loop on a
      # fresh boot) plus an explicit log-dir / db-url (the bare defaults pointed
      # into the old :ro mount). Mirrors tests/separability/docker-compose.s4.yml.
      # FR26 single-writer is preserved: registry-state remains the sole writer of
      # the materialized STATE tables; registry-api only appends the JSONL event
      # log (fcntl-serialized, Story 11.2.3) + its own idempotency_cache table.
      REGISTRY_API_LOG_DIR: ${REGISTRY_API_LOG_DIR:-/var/lib/oh-my-bmad/registry/events}
      REGISTRY_API_DB_URL: ${REGISTRY_API_DB_URL:-sqlite+aiosqlite:////var/lib/oh-my-bmad/registry/state.sqlite3}
      # Story 11.3.12 — the writable idempotency cache lives in its OWN SQLite
      # file so registry-api (uid 10001) is its sole writer and registry-state
      # (uid 10002) is the sole writer of state.sqlite3. This closes the
      # cross-uid WAL crash-loop: previously registry-api's writable cache
      # engine created state.sqlite3-wal/-shm owned by 10001 at 0o644, locking
      # registry-state out of its own DB (OperationalError: readonly database).
      REGISTRY_API_IDEMPOTENCY_DB_URL: ${REGISTRY_API_IDEMPOTENCY_DB_URL:-sqlite+aiosqlite:////var/lib/oh-my-bmad/registry/idempotency.sqlite3}
      # Self-contained ROOT compose has no migrator step for the idempotency
      # file, so registry-api create_all's its own idempotency_cache table on
      # start (mirrors REGISTRY_STATE_AUTO_CREATE_SCHEMA; default OFF in prod).
      REGISTRY_API_AUTO_CREATE_IDEMPOTENCY_SCHEMA: ${REGISTRY_API_AUTO_CREATE_IDEMPOTENCY_SCHEMA:-1}
    init: true
    restart: unless-stopped
    networks: [oh-my-bmad-net]
    # Story 11.3.6 (H7a): registry-state creates the DB + schema; wait for it so
    # registry-api doesn't open a not-yet-existent SQLite file on a fresh volume.
    depends_on:
      registry-state:
        condition: service_healthy
    volumes:
      - oh-my-bmad-data:/var/lib/oh-my-bmad
    # Story 11.3.6 (H7d): registry-api is a uvicorn HTTP server — it never
    # creates /tmp/ready (the shared *healthcheck file convention is for the
    # tail-loop services). Probe the TCP port instead, mirroring the proven
    # journey/s4 overlays (tests/separability/docker-compose.s4.yml:51-60).
    healthcheck: *healthcheck_http

  registry-state:
    container_name: omb-registry-state
    build:
      context: .
      dockerfile: services/registry-state/Dockerfile
    image: ${OMB_IMAGE_REGISTRY:-ghcr.io/r2d2}/oh-my-bmad-registry-state:${OMB_VERSION:-dev}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *common-env
      REGISTRY_DB_PATH: ${REGISTRY_DB_PATH:-/var/lib/oh-my-bmad/registry/state.sqlite3}
      # Story 11.3.5: env-driven, default OFF in production (unchanged — schema
      # comes from the operator/migrator's `alembic upgrade head`, Story 2.14).
      # Self-contained test stacks (S-4 separability) export =1 to bootstrap the
      # schema in-process, mirroring the S-1/S-2/S-3 test composes. Empty/unset
      # → registry-state's `== "1"` check is False → no-op.
      REGISTRY_STATE_AUTO_CREATE_SCHEMA: ${REGISTRY_STATE_AUTO_CREATE_SCHEMA:-}
    init: true
    restart: unless-stopped
    networks: [oh-my-bmad-net]
    volumes:
      - oh-my-bmad-data:/var/lib/oh-my-bmad
    healthcheck: *healthcheck

  telegram-gateway:
    container_name: omb-telegram-gateway
    build:
      context: .
      dockerfile: services/telegram-gateway/Dockerfile
    image: ${OMB_IMAGE_REGISTRY:-ghcr.io/r2d2}/oh-my-bmad-telegram-gateway:${OMB_VERSION:-dev}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *common-env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TG_ALLOWLIST_USER_IDS: ${TG_ALLOWLIST_USER_IDS:-}
      # Story 11.3.7 (AC2 / D2-A) — propagate the hermetic skip flag from
      # shell substitution so test harnesses can flip the gateway into
      # offline boot (lifespan skips bot.set_webhook(...) + treats webhook
      # URL/secret as optional via apply_hermetic_defaults_to_env).
      # Default "0" (not empty) because pydantic-settings rejects empty
      # string → bool coercion; "0" parses as False unambiguously.
      # Production operators leave the shell var unset for normal
      # set_webhook behavior (default "0" → False).
      TELEGRAM_SKIP_WEBHOOK_SET: ${TELEGRAM_SKIP_WEBHOOK_SET:-0}
    init: true
    restart: unless-stopped
    networks: [oh-my-bmad-net]
    # Story 11.3.6 (H7d): telegram-gateway is a uvicorn HTTP server (binds
    # 0.0.0.0:8080) and never creates /tmp/ready — probe the TCP port instead
    healthcheck: *healthcheck_http

  orchestrator-adapter:
    container_name: omb-orchestrator-adapter
    build:
      context: .
      dockerfile: services/orchestrator-adapter/Dockerfile
    # Story 2.15 / FR35 / NFR-M5 — orchestrator pass-through swap.
    # ``ORCHESTRATOR_IMAGE`` env-var indirection lets operators (and the S-3
    # separability test) replace the default orchestrator-adapter image with
    # any compatible image (e.g. ``null-orchestrator:latest``) via a single
    # variable. When unset, the default tag below is used so operator
    # behavior is unchanged. The ``build:`` directive remains so
    # ``docker compose build`` still tags the local default image — the
    # alternative image is built separately by its own pipeline (the S-3
    # test harness builds ``null-orchestrator:latest`` itself).
    image: ${ORCHESTRATOR_IMAGE:-${OMB_IMAGE_REGISTRY:-ghcr.io/r2d2}/oh-my-bmad-orchestrator-adapter:${OMB_VERSION:-dev}}
    env_file:
      - path: .env
        required: false
    environment:
      # Story 11.3.6 (H7b): MCP-subprocess env via shared anchor (see top of
      # file). Identity = orchestrator (ActorKind, packages/events/.../envelope.py:183).
      # Forwarded to the spawned servers by the allowlist in adapters/mcp_clients.py
      # (NEVER os.environ.copy — the a0ca050 P0 leak). Per-service override:
      # ACTOR_KIND/ACTOR_ID only; everything else comes from *mcp_spawner_env.
      <<: [*common-env, *mcp_spawner_env]
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TASK_REGISTRY_ACTOR_KIND: orchestrator
      TASK_REGISTRY_ACTOR_ID: orchestrator-adapter
      SESSION_REGISTRY_ACTOR_KIND: orchestrator
      SESSION_REGISTRY_ACTOR_ID: orchestrator-adapter
      CLAWHIP_BRIDGE_ACTOR_KIND: orchestrator
      CLAWHIP_BRIDGE_ACTOR_ID: orchestrator-adapter
      # FC-P6-1 — Worker pool auto-scaling (config-gated, disabled by default).
      WORKER_AUTOSCALE_ENABLED: ${WORKER_AUTOSCALE_ENABLED:-false}
      WORKER_AUTOSCALE_UP_THRESHOLD: ${WORKER_AUTOSCALE_UP_THRESHOLD:-3}
      WORKER_AUTOSCALE_DOWN_THRESHOLD: ${WORKER_AUTOSCALE_DOWN_THRESHOLD:-2}
      WORKER_AUTOSCALE_MIN: ${WORKER_AUTOSCALE_MIN:-1}
      WORKER_AUTOSCALE_MAX: ${WORKER_AUTOSCALE_MAX:-5}
      WORKER_AUTOSCALE_POLL_INTERVAL_S: ${WORKER_AUTOSCALE_POLL_INTERVAL_S:-30.0}
    init: true
    restart: unless-stopped
    networks: [oh-my-bmad-net]
    # Story 11.3.6 (H7b): task-registry reads the DB (needs registry-state's
    # schema) and the spawned clawhip-bridge appends the shared event log, so
    # mount the volume RW (FR26 fcntl serialization, Story 11.2.3). Wait for the
    # DB (registry-state) and the spine writer (registry-api) to be healthy.
    depends_on:
      registry-state:
        condition: service_healthy
      registry-api:
        condition: service_healthy
    volumes:
      - oh-my-bmad-data:/var/lib/oh-my-bmad
    # Story 11.3.10 (H7f deep-fix): *healthcheck_mcp (start_period 100s) not
    # the shared *healthcheck (~70s). 3 sequential MCP inits at
    # _INIT_TIMEOUT=30s = 90s worst-case ceiling > the 70s shared window →
    # the Story 11.3.7 Task-7 "5/7 healthy → TimeoutError" restart-oscillation.
    healthcheck: *healthcheck_mcp

  worker-wrapper:
    # Story 32.5 (FR104): container_name removed to enable
    # `docker compose up --scale worker-wrapper=N`. Fixed container_name
    # conflicts when N > 1. Each replica gets an auto-generated name like
    # omb-worker-wrapper-1, omb-worker-wrapper-2, etc.
    build:
      context: .
      dockerfile: services/worker-wrapper/Dockerfile
    image: ${OMB_IMAGE_REGISTRY:-ghcr.io/r2d2}/oh-my-bmad-worker-wrapper:${OMB_VERSION:-dev}
    env_file:
      - path: .env
        required: false
    environment:
      # Story 11.3.6 (H7b): MCP-subprocess env via shared anchor; identity = worker.
      # ANTHROPIC_API_KEY / GITHUB_TOKEN are the worker's OWN secrets and are
      # deliberately NOT in the mcp_clients.py allowlist — they never reach the
      # MCP subprocesses. (H7h): WORKER_READY_FILE_PATH pins the worker's
      # ready-file to /tmp/ready so the shared *healthcheck (test -f /tmp/ready)
      # matches; the worker default is per-pid (/tmp/worker-wrapper-ready-<pid>).
      <<: [*common-env, *mcp_spawner_env]
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      TASK_REGISTRY_ACTOR_KIND: worker
      TASK_REGISTRY_ACTOR_ID: worker-wrapper
      SESSION_REGISTRY_ACTOR_KIND: worker
      SESSION_REGISTRY_ACTOR_ID: worker-wrapper
      CLAWHIP_BRIDGE_ACTOR_KIND: worker
      CLAWHIP_BRIDGE_ACTOR_ID: worker-wrapper
      WORKER_READY_FILE_PATH: /tmp/ready
      # Story 32.5 (FR104): WORKER_ID defaults to hostname-pid inside the
      # container, but can be overridden per-replica via env. Each replica's
      # hostname is unique in Docker Compose (e.g. omb-worker-wrapper-1).
    init: true
    restart: unless-stopped
    networks: [oh-my-bmad-net]
    # Story 11.3.6 (H7b): RW (was :ro) so the spawned clawhip-bridge can append
    # the shared event log; task-registry reads the DB. Wait for registry-state
    # (DB/schema) + registry-api (spine writer) to be healthy.
    depends_on:
      registry-state:
        condition: service_healthy
      registry-api:
        condition: service_healthy
    volumes:
      - oh-my-bmad-data:/var/lib/oh-my-bmad
    # Story 11.3.10 (H7f deep-fix): *healthcheck_mcp (start_period 100s) not
    # the shared *healthcheck (~70s). worker-wrapper mirrors the orchestrator's
    # 3-sequential-MCP-init = 90s worst-case ceiling > 70s shared window →
    # the same restart-oscillation Story 11.3.7 Task-7 observed.
    healthcheck: *healthcheck_mcp

  clawhip-daemon:
    container_name: omb-clawhip-daemon
    build:
      context: .
      dockerfile: services/clawhip-daemon/Dockerfile
    image: ${OMB_IMAGE_REGISTRY:-ghcr.io/r2d2}/oh-my-bmad-clawhip-daemon:${OMB_VERSION:-dev}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *common-env
      REGISTRY_DB_PATH: ${REGISTRY_DB_PATH:-/var/lib/oh-my-bmad/registry/state.sqlite3}
      # Story 11.3.7 (AC4 / H7e) — propagate TELEGRAM_BOT_TOKEN via shell
      # substitution so CI envs without an .env file can still boot
      # clawhip-daemon (which sys.exit(2)s on missing/empty token).
      # Mirrors telegram-gateway's existing TELEGRAM_BOT_TOKEN line for
      # consistency. The s3-separability harness exports a dummy token
      # for Phase 1; production operators continue to set the real value
      # via .env (when shell is unset, .env value flows through env_file;
      # when shell is set explicitly, it takes precedence — matches the
      # existing telegram-gateway contract above).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    init: true
    restart: unless-stopped
    networks: [oh-my-bmad-net]
    volumes:
      - oh-my-bmad-data:/var/lib/oh-my-bmad:ro
    healthcheck: *healthcheck

  # Story 10.6 / FR62a / NFR-M4/M5 — derived-metrics subscriber.
  # Internal-only per P2-I5 (NO `ports:` block) — operator scrapes via
  # SSH tunnel or co-located Prometheus container on the same docker
  # network. Read-only consumer of the JSONL event log written by
  # registry-state (P2-I1). `depends_on: registry-state` ONLY (P2-I3 —
  # subscriber is decoupled from registry-api / worker-wrapper /
  # clawhip-daemon by design; only the JSONL availability gates it).
  #
  # Healthcheck overrides the shared `*healthcheck` anchor (which uses
  # the `/tmp/ready` file-touch convention) — metrics-subscriber's
  # FastAPI surface exposes a JSON `/healthz` probe (Story 10.3) which
  # is purpose-built for compose `service_healthy` gating without
  # touching `/metrics` (a hot path under Prometheus scrape; D3).
  #
  # `restart: unless-stopped` means the subscriber retries on exit
  # codes 2 (cursor schema refused) and 3 (corrupt region) — these
  # are non-transient and will loop, but the matrix is documented in
  # __main__.py and a structured `metrics_subscriber_lifespan_failure`
  # log fires before each exit so operators can intervene.
  metrics-subscriber:
    container_name: omb-metrics-subscriber
    build:
      context: .
      dockerfile: services/metrics-subscriber/Dockerfile
    image: ${OMB_IMAGE_REGISTRY:-ghcr.io/r2d2}/oh-my-bmad-metrics-subscriber:${OMB_VERSION:-dev}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *common-env
      OMB_METRICS_EVENT_LOG_DIR: /var/lib/oh-my-bmad/registry/events
      OMB_METRICS_CURSOR_PATH: /var/lib/oh-my-bmad/metrics-subscriber/cursor.json
      OMB_METRICS_POLL_INTERVAL_S: "${OMB_METRICS_POLL_INTERVAL_S:-0.5}"
      OMB_METRICS_METRICS_HOST: "0.0.0.0"
      OMB_METRICS_METRICS_PORT: "9090"
      OMB_METRICS_RUN_MODE: server
    depends_on:
      registry-state:
        condition: service_healthy
    init: true
    restart: unless-stopped
    networks: [oh-my-bmad-net]
    volumes:
      - oh-my-bmad-data:/var/lib/oh-my-bmad
    healthcheck:
      # D3 — probe /healthz over loopback (NOT /metrics — hot path
      # under Prometheus scrape would skew benchmark numbers and add
      # noise to access logs). The shared `*healthcheck` anchor uses
      # `test -f /tmp/ready`; metrics-subscriber's FastAPI surface
      # does not touch that file, so we override per-service to
      # exercise the real readiness route.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:9090/healthz', timeout=2); sys.exit(0 if r.status==200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Story 2.14 / FR22 / FR50 / NFR-M3 — schema-evolution migrator.
  # One-shot semantics: ``restart: "no"`` so a successful run exits cleanly.
  # ``profiles: ["migrate"]`` keeps it OFF by default — the operator's
  # ``just dev`` (i.e. ``docker compose up -d``) does NOT start the migrator.
  # Activation:
  #   docker compose run --rm migrator v1.0.0-to-v1.0.1
  #   docker compose --profile migrate up migrator
  # Mounts the same ``oh-my-bmad-data`` volume read-write — the migrator
  # writes the new log + archive in-place.
  migrator:
    container_name: omb-migrator
    build:
      context: .
      dockerfile: scripts/migrator/Dockerfile
    image: ${OMB_IMAGE_REGISTRY:-ghcr.io/r2d2}/oh-my-bmad-migrator:${OMB_VERSION:-dev}
    profiles: ["migrate"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *common-env
      EVENT_LOG_PATH: ${EVENT_LOG_PATH:-/var/lib/oh-my-bmad/registry/events/current.jsonl}
    init: true
    restart: "no"
    networks: [oh-my-bmad-net]
    volumes:
      - oh-my-bmad-data:/var/lib/oh-my-bmad

  # Story 13.1 / FR69 / ADR-0007 — litestream WAL replication sidecar.
  # DISASTER RECOVERY, NOT HA (replication ≠ HA — see ADR-0007): ships the
  # registry-state SQLite WAL stream off-host to an operator-configured
  # S3-compatible target. No failover, no second live writer — recovery is the
  # manual stack-down procedure in Story 13.3 (just restore-from-litestream).
  #
  # OFF by default, two independent levers (both required to actually run it):
  #   1. ``profiles: ["litestream"]`` keeps it out of a plain ``docker compose
  #      up`` (mirrors the migrator). Activate with:
  #        docker compose --profile litestream up -d litestream
  #   2. The operator points OMB_LITESTREAM_CONFIG_PATH at a filled-in
  #      ``litestream.yml`` (Story 13.2 ships the template + credential docs).
  #      Unset → the bind mount falls back to ./litestream.yml; if that is
  #      absent the operator simply never enables the profile.
  #
  # Mounts the data volume READ-WRITE (required — see ADR-0007 §3). litestream
  # is NOT a passive reader: it (a) creates a ``.state.sqlite3-litestream/``
  # metadata dir alongside the DB and (b) TAKES OVER checkpointing
  # (``PRAGMA wal_autocheckpoint=0`` then issues its own ``wal_checkpoint``),
  # which writes the .db + -wal/-shm files. A ``:ro`` mount would break
  # replication outright. FR26 single-writer is preserved NOT by the mount mode
  # but by design: registry-state remains the sole AUTHOR of rows; litestream
  # only relocates already-committed WAL frames (checkpoint) + writes its own
  # meta dir + the remote replica — it never originates application data
  # (ADR-0007 §1/§3). Runs the upstream public image (config-not-code); no
  # oh-my-bmad-base derivative needed. Replication-lag health observability
  # lands in Story 13.4 (litestream-lag-check + replication.lagging) — this
  # story intentionally ships the sidecar without a compose healthcheck (like
  # the migrator), so it is orthogonal to the core "N/N healthy" count.
  litestream:
    container_name: omb-litestream
    image: litestream/litestream:${LITESTREAM_VERSION:-0.3.13}
    profiles: ["litestream"]
    env_file:
      - path: .env
        required: false
    command: ["replicate", "-config", "/etc/litestream/litestream.yml"]
    init: true
    restart: unless-stopped
    networks: [oh-my-bmad-net]
    # Story 13.2: wait for registry-state to be healthy so the state.sqlite3 DB
    # exists before litestream tries to tail it (avoids a restart-loop on cold
    # start). Profile-gated, so this only applies when the operator opts in.
    depends_on:
      registry-state:
        condition: service_healthy
    # Story 13.1 review (MEDIUM): join the shared ``omb`` group (gid 10000) so the
    # sidecar can read+write the 0o660 DB files (Story 11.3.12) even if it runs
    # non-root. No-op while the upstream image runs as root; pure upside if a
    # future image drops root or an operator adds a ``user:`` override. An
    # explicit non-root ``user:`` stays deferred until first-live-enable confirms
    # the upstream image tolerates it (ADR-0007 verification item).
    group_add: ["10000"]
    volumes:
      - oh-my-bmad-data:/var/lib/oh-my-bmad
      - ${OMB_LITESTREAM_CONFIG_PATH:-./litestream.yml}:/etc/litestream/litestream.yml:ro

networks:
  oh-my-bmad-net:
    driver: bridge

volumes:
  oh-my-bmad-data:
    driver: local
